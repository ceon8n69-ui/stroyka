<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eceef0" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)">
<title>Стройка</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Стройка">
<meta name="format-detection" content="telephone=no">

<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#121826;--muted:#5f6b82;--line:#dde2eb;--accent:#1f4fbf;--on:#fff;--soft:#e7edfb;--ok:#1b8a3a;--bad:#d02f2f;--warn:#a86300;--shadow:0 1px 2px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0c121c;--card:#161f2e;--ink:#e9eef7;--muted:#95a2b8;--line:#283447;--accent:#6b97ff;--on:#0c121c;--soft:#1b2940;--ok:#62d283;--bad:#ff7d76;--warn:#ffb54d;--shadow:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.4 system-ui,Roboto,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;min-height:100dvh}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:22px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:44px;height:44px;border:0;background:none;border-radius:10px;font-size:26px;line-height:1;display:grid;place-items:center;flex:none}
.ico:active{background:var(--soft)}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill[data-s=ok] i{background:var(--ok)} .pill[data-s=pend] i{background:var(--warn)} .pill[data-s=err] i{background:var(--bad)} .pill[data-s=busy] i{background:var(--accent);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.wrap{padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:18px;margin:18px 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{font-weight:500;color:var(--muted);font-size:14px}
.muted{color:var(--muted)} .sm{font-size:14px}
.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--bad)} .warn{color:var(--warn)}
.obj{display:block;width:100%;text-align:left;border-left:5px solid var(--accent)}
.obj.done{border-left-color:var(--muted);opacity:.8}
.obj b{font-size:18px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.li:last-child{border-bottom:0}
.btns a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:inherit;white-space:nowrap}
.av{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}.av.big{width:56px;height:56px;font-size:20px}
.li:active{background:var(--soft)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right}
.li .r small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.empty{padding:18px 14px;color:var(--muted);text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip.add{border-style:dashed;color:var(--accent)}
.btn{min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:650}
.btn:active{filter:brightness(.95)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.bad{color:var(--bad)}
.btn.big{min-height:58px;font-size:18px;width:100%}
.btn.w{width:100%}
.btns{display:flex;gap:8px;margin-top:16px}
.btns .btn{flex:1}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.acts button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:68px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:13px;font-weight:650}
.acts button span{font-size:22px;line-height:1}
.acts button.p{background:var(--accent);color:var(--on);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-size:19px}
.kv .wide{grid-column:1/-1}
.kv b.big-num{font-size:34px}
.f{display:block;margin:12px 0 0}
.f>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center}
.step button{height:56px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:28px;font-weight:600}
.step input{text-align:center;font-size:26px;font-weight:700;min-height:56px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;padding:12px;border-radius:14px;background:var(--soft)}
.res small{display:block;font-size:12px;color:var(--muted)}
.res b{font-size:20px}
.res .main b{font-size:26px;color:var(--accent)}
.sel{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--accent);border-radius:12px;background:var(--soft)}
.sel .t{flex:1}
.rl{max-height:300px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px}
.rl .li{min-height:50px}
.task{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);min-height:54px;padding:0 8px 0 4px}
.task:last-child{border-bottom:0}
.task .ck{width:46px;height:46px;border:0;background:none;display:grid;place-items:center;flex:none}
.task .ck i{width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:17px;color:var(--on)}
.task.done .ck i{background:var(--ok);border-color:var(--ok)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:8px 0}
.task .tt small{display:block;color:var(--muted);font-size:12px}
.tag{font-size:12px;font-weight:650;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--accent);white-space:nowrap}
.tag.late{background:rgba(208,47,47,.12);color:var(--bad)}
.qadd{display:flex;gap:8px;padding:8px}
.qadd input{flex:1}
.qadd button{width:52px;flex:none}
.big-num{font-size:34px;font-weight:800}
.fab{position:fixed;right:max(14px,calc(50% - 306px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;height:60px;padding:0 24px;border:0;border-radius:30px;background:var(--accent);color:var(--on);font-size:18px;font-weight:750;box-shadow:0 6px 18px rgba(31,79,191,.35)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:160px;height:66px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:650;color:var(--muted);position:relative}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs .bd{position:absolute;top:7px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:94dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.shh{display:flex;align-items:center;gap:6px;padding:10px 6px 6px 16px;border-bottom:1px solid var(--line)}
.shh b{flex:1;font-size:19px}
.shb{overflow:auto;padding:4px 14px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.menu .li{font-size:17px}
.menu .li span:first-child{width:28px;text-align:center;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:40;max-width:90vw;padding:12px 18px;border-radius:12px;background:#1b2333;color:#fff;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1;transform:translateX(-50%)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph div{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;width:26px;height:26px;border:0;border-radius:13px;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center}
.viewer img{max-width:100%;max-height:100%}
.estl{display:grid;grid-template-columns:1fr 78px 92px 30px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.estl:last-child{border-bottom:0}
.estl input{min-height:40px;padding:6px 8px;font-size:16px;text-align:center}
.estl .x{border:0;background:none;color:var(--bad);font-size:18px}
.estl small{display:block;color:var(--muted);font-size:12px}
html{touch-action:manipulation}
body.ed{overflow:hidden;position:fixed;inset:0;width:100%;overscroll-behavior:none}
body.ed #view{overflow:hidden}
.ed{max-width:100vw;overflow:hidden;touch-action:none}
.edbar{overflow-x:auto;scrollbar-width:none;touch-action:pan-x}.edbar::-webkit-scrollbar{display:none}
.edbar .ico{width:40px;height:40px;font-size:23px}
.ed .seg button{padding:0 12px}
.edt{display:flex;gap:5px;overflow-x:auto;padding:0 8px 6px;scrollbar-width:none;touch-action:pan-x;flex:none}.edt::-webkit-scrollbar{display:none}
.edt button{flex:none;min-width:58px;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 6px}
.edt button b{font-size:18px;line-height:1}.edt button small{font-size:10.5px;font-weight:650;color:var(--muted)}
.edt button.on{background:var(--accent);border-color:var(--accent)}.edt button.on small,.edt button.on b{color:var(--on)}
.edp{touch-action:pan-y;overflow-x:hidden;overscroll-behavior:contain}
.edp .chips{touch-action:pan-x}
.edp .mini{gap:5px;margin-top:6px}.edp .mini div{padding:4px 8px}.edp .mini b{font-size:14px}.edp .f{margin-top:6px}
.ed.full .edp,.ed.full .edt{display:none}.ed.full .edc{margin-bottom:calc(8px + env(safe-area-inset-bottom))}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pal button{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pal button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pal canvas{width:44px;height:44px;border-radius:8px}
.pal small{font-size:10.5px;line-height:1.15;text-align:center;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tabs button{min-width:0}
body.ed #app{height:100dvh;display:flex;flex-direction:column;padding-bottom:0}
body.ed #view{flex:1;min-height:0;display:flex}
body.ed .tabs,body.ed .fab{display:none!important}
.ed{flex:1;display:flex;flex-direction:column;min-height:0;width:100%}
.edbar{display:flex;align-items:center;gap:2px;padding:6px 8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-right:auto}
.seg button{border:0;background:none;height:38px;padding:0 20px;border-radius:9px;font-weight:700}
.seg button.on{background:var(--accent);color:var(--on)}
.edc{position:relative;flex:1;min-height:180px;margin:0 8px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.edc canvas{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none;display:block}
#c3d{position:absolute;inset:0}
.edp{flex:none;max-height:34dvh;overflow:auto;padding:2px 12px calc(12px + env(safe-area-inset-bottom))}
.edp .f{margin-top:8px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mini div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.mini small{display:block;color:var(--muted);font-size:11px}
.mini b{font-size:15px;white-space:nowrap}
.link{color:var(--accent);background:none;border:0;padding:0;font-weight:650;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.alerts{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.alert{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.alert i{width:6px;align-self:stretch;border-radius:3px;background:var(--accent);flex:none}
.alert.bad i{background:var(--bad)} .alert.warn i{background:var(--warn)}
.cmd{display:flex;gap:8px;margin:8px 0}
.cmd input{flex:1}
.cmd button{width:56px;flex:none}
.acts .actlbl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:68px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:13px;font-weight:650;cursor:pointer}
.acts .actlbl span{font-size:22px;line-height:1}
.subtabs .chip{padding:0 12px;font-size:14px;height:38px}
.subtabs{position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:6px 0;margin:4px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--soft)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:1px 6px;border-radius:6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.past{opacity:.65}
.ev{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--accent);background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:6px}
.ev small{display:block;color:var(--muted)}
.ev.measure{border-left-color:var(--warn)} .ev.buy{border-left-color:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok)} .bar.over i{background:var(--bad)}
.pstat{font-size:12px;font-weight:700;padding:1px 7px;border-radius:7px;background:var(--soft);color:var(--accent)}
.pstat.paid{background:rgba(27,138,58,.14);color:var(--ok)} .pstat.late{background:rgba(208,47,47,.13);color:var(--bad)}
.menu-h{font-size:12px;font-weight:750;color:var(--muted);margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.05em}
.wrap>.seg button{flex:1}
details{margin-top:10px}
details>summary{color:var(--accent)}
body.big{font-size:18px}
body.big .btn{min-height:56px;font-size:18px} body.big .chip{height:48px;font-size:17px;padding:0 18px} body.big .li{min-height:66px}
body.big input,body.big select,body.big textarea{min-height:56px;font-size:19px} body.big .tabs button{height:74px;font-size:13px} body.big .li .t small{font-size:15px}
body.big .acts button,body.big .acts .actlbl{height:78px;font-size:15px}
pre{white-space:pre-wrap;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;user-select:all}
details summary{cursor:pointer;font-weight:600;padding:8px 0}

:root{--bg:#eceef0;--card:#fafafb;--ink:#0e0f11;--muted:#767a83;--line:#e0e2e6;--accent:#0e0f11;--on:#fafafb;--soft:#e4e6e9;
  --ok:#11824a;--bad:#d9412f;--warn:#a96200;--mint:#cde9e2;--mint2:#b5ddd3;--lav:#e4daf7;--peach:#fbe2c3;--rose:#f8d5cf;
  --inv:#0e0f11;--inv2:#1d1e22;--inv-ink:#fafafb;--inv-mut:#8e9199;--pink:#3a5a53;--r:26px;--shadow:none;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0c0d;--card:#17181b;--ink:#f2f3f5;--muted:#8d9199;--line:#26282d;--accent:#cde9e2;--on:#0b0c0d;--soft:#202226;
  --ok:#5fd394;--bad:#ff7b6b;--warn:#ffbd5c;--inv:#cde9e2;--inv2:#b5ddd3;--inv-ink:#0b0c0d;--inv-mut:#3f5d56;--shadow:none}}
html,body{background:var(--bg)}
body{font-family:'Manrope',system-ui,Roboto,sans-serif;font-weight:500;letter-spacing:-.005em}
.n,.big-num,.kv b{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
b,strong{font-weight:700}

/* шапка */
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:0;padding-top:calc(10px + env(safe-area-inset-top))}
.top h1{font-size:25px;font-weight:700;letter-spacing:-.03em}
.top .ico{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);font-size:22px;margin-left:4px}
#backBtn{border-color:var(--ink)}
.pill{background:var(--card);border:0;height:34px;font-weight:600}

/* поверхности */
.card,.list,.kv>div,.day,.mini div,.rl{border:0;border-radius:var(--r);background:var(--card);box-shadow:none}
.list{padding:4px 0}
.li{border-bottom:1px solid var(--line);margin:0;min-height:58px;padding:10px 16px}
.list>.li:last-child,.list>*:last-child .li{border-bottom:0}
.li .t b{font-weight:650;letter-spacing:-.01em}
.wrap{padding:6px 14px}
h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:22px 4px 10px}
h2 small{font-weight:600}
.empty{color:var(--muted)}
.menu-h{text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;margin:18px 6px 8px}

/* кнопки и чипы */
.btn{min-height:52px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:700;padding:0 20px}
.btn.p{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.bad{border-color:var(--bad)}
.chip{height:40px;border:0;border-radius:999px;background:var(--card);font-weight:650;padding:0 16px}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.add{border:1.5px dashed var(--muted);background:transparent;color:var(--ink)}
.seg{background:var(--card);border:0;border-radius:999px;padding:4px}
.seg button{border-radius:999px}
.seg button.on{background:var(--ink);color:var(--bg)}
.subtabs .chip{height:38px}
.link{color:var(--ink)}
details>summary{color:var(--ink)}

/* быстрые действия: таблетки с иконкой в кольце */
.acts{grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.acts button,.acts .actlbl{flex-direction:row;justify-content:flex-start;height:62px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;padding:0 16px 0 6px;gap:12px;font-size:16px;font-weight:700}
.acts button span,.acts .actlbl span{width:48px;height:48px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.acts svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acts button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* цифры: первая плитка — тёмная панель, вторая — мятная */
.kv{gap:10px}
.kv>div{padding:14px 16px}
.kv small{font-size:12.5px;font-weight:600}
.kv b{font-size:21px;font-weight:700}

<div id="sheet"></div>
<div id="toast" role="status"></div>
<script src="supabase.js"></script>
<script>
'use strict';
/* ================= данные ================= */
const KEY='stroyka.v1',SYNC_KEY='stroyka.sync2';
const COLS=['objects','tasks','work','workers','rates','est','plans','events','photos','estv','payplan','cash','team','checks','tpls','log','trash','calcs','mprice','expenses','payments','fuelDays','tools','stores','materials','prices','baskets','msgs'];
const CATS=['Материалы','Доставка','Инструмент','Топливо','Аренда техники','Питание','Прочее'];
const MAT_CATS=['Материалы','Доставка'];
const UNITS=['м²','п.м.','шт','точка','м³','т','ч','день','рейс','компл.'];
const FUEL={gas:'Газ',a95:'Бензин А-95',dt:'Дизель'};
const OLD_KINDS={day:['Посуточно','дн.'],hour:['Почасово','ч'],piece:['Сдельно','ед.'],fixed:['Фикс. сумма',''],deal:['Сдельная (прибыль)','']};
/* стартовый прайс — ориентировочные цены, правятся в «Прайс работ» */
const SEED=[
 ['Электрика','Штроба в кирпиче','п.м.',60,120],['Электрика','Штроба в бетоне','п.м.',100,200],
 ['Электрика','Подрозетник в кирпиче','шт',60,120],['Электрика','Подрозетник в бетоне','шт',100,200],
 ['Электрика','Прокладка кабеля','п.м.',15,30],['Электрика','Установка розетки / выключателя','шт',50,100],
 ['Электрика','Точка освещения','шт',120,250],['Электрика','Автомат в щиток','шт',80,160],
 ['Стены','Штукатурка стен','м²',120,250],['Стены','Шпаклёвка','м²',70,150],['Стены','Покраска','м²',40,90],
 ['Стены','Поклейка обоев','м²',60,130],['Стены','Демонтаж штукатурки','м²',40,80],
 ['Плитка','Укладка плитки','м²',350,650],['Плитка','Затирка швов','м²',50,100],
 ['Пол','Стяжка пола','м²',120,250],['Пол','Укладка ламината','м²',80,170],
 ['Гипсокартон','Перегородка ГКЛ','м²',250,450],['Гипсокартон','Потолок ГКЛ','м²',300,550],
 ['Сантехника','Точка водопровода / канализации','точка',500,1000],['Сантехника','Установка унитаза','шт',600,1200],
 ['Сантехника','Установка смесителя','шт',300,600],
 ['Забор, сварка','Установка столба','шт',200,400],['Забор, сварка','Монтаж профнастила','п.м.',200,400],['Забор, сварка','Сварочные работы','ч',250,500],
 ['Прочее','Вывоз мусора','рейс',400,900],['Прочее','Час работы мастера','ч',200,400],['Прочее','День работы','день',1200,2000]
];
const DEF_SET={name:'',firm:'',phone:'',fuel:'gas',price:{gas:44,a95:81,dt:91},cons:{gas:10,a95:8,dt:7},amort:15,lastObj:'',lastWorker:'',recent:[],recentEst:[]};

function loadJSON(k,d){try{const j=JSON.parse(localStorage.getItem(k)||'null');return j&&typeof j==='object'?j:d}catch(e){return d}}
function load(){
  const j=loadJSON(KEY,{}),s=j.settings||{};
  const S={settings:{...DEF_SET,...s,price:{...DEF_SET.price,...(s.price||{})},cons:{...DEF_SET.cons,...(s.cons||{})}}};
  if(!Array.isArray(S.settings.recent))S.settings.recent=[];
  if(!Array.isArray(S.settings.recentEst))S.settings.recentEst=[];
  for(const k in j)if(Array.isArray(j[k]))S[k]=j[k];
  for(const c of COLS)if(!Array.isArray(S[c]))S[c]=[];
  return S;
}
let S=load();
let SY=Object.assign({url:'',key:'',email:'',pend:{},ph:{},last:0,err:''},loadJSON(SYNC_KEY,{}));
if(!SY.url){const old=loadJSON('stroyka.sync',{});if(old.url){SY.url=old.url;SY.key=old.key;SY.email=old.email||''}}
let storageWarned=false;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!storageWarned){storageWarned=true;toast('Память телефона недоступна — данные не сохранятся')}}}
function saveSync(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}}

/* ================= утилиты ================= */
const $=s=>document.querySelector(s);
const view=$('#view'),sheetRoot=$('#sheet');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money=n=>nf.format(Math.round(n||0))+' ₴';
const qf=n=>nf2.format(+n||0);
const num=v=>{const x=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:0};
const r2=x=>Math.round((+x||0)*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=d=>{const p=String(d||'').split('-');return p.length===3?`${p[2]}.${p[1]}`:''};
const fdateY=d=>{const p=String(d||'').split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:''};
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const byDate=(a,b)=>String(b.date||'').localeCompare(String(a.date||''))||((b.ts||0)-(a.ts||0));
const oname=id=>(S.objects.find(o=>o.id===id)||{}).name||'Без объекта';
const wid=name=>'w_'+String(name).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
const me=()=>(SY.role==='worker'&&SY.pname)||S.settings.name||SY.email||'';
const v=id=>{const el=document.getElementById(id);return el?el.value:''};
const g=id=>document.getElementById(id);
const capPlug=n=>(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n])||null;
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2400)}

/* запись с отметкой для синхронизации */
function mark(c,id){const k=c+'/'+id;SY.pend[k]=(SY.pend[k]||0)+1}
function commit(noRender){saveLocal();saveSync();setStatus();schedule(600);if(!noRender)render()}

function seedRates(){
  if(S.settings.seeded||SY.role==='worker')return;
  S.settings.seeded=1;
  if(S.rates.length)return;
  SEED.forEach(([cat,name,unit,worker,client],i)=>{const id='seed'+(i+1);S.rates.push({id,cat,name,unit,worker,client,ts:0});mark('rates',id)});
  saveLocal();saveSync();
}
function migrate(){
  let ch=false;
  for(const o of S.objects){
    if(Array.isArray(o.tasks)&&o.tasks.length){
      o.tasks.forEach(t=>{const id='t_'+o.id+'_'+t.id;if(!S.tasks.find(x=>x.id===id))put('tasks',{id,objectId:o.id,title:t.title||'',done:t.status==='done',who:'',due:''})});
      delete o.tasks;put('objects',o);ch=true;
    }
  }
  const have=new Set(S.workers.map(w=>w.name));
  S.work.forEach(w=>{if(w.worker&&!have.has(w.worker)){have.add(w.worker);put('workers',{id:wid(w.worker),name:w.worker,phone:''});ch=true}});
  if(ch){saveLocal();saveSync()}
  return ch;
}

/* ================= расчёты ================= */
/* партнёр (владелец) — его работа не зарплата, а его доля */
const isPartner=n=>!!n&&(S.team.length?S.team.some(t=>t.name===n):n===me());
function objStats(id){
  const pays=S.payments.filter(p=>p.objectId===id);
  const receivedWork=sum(pays.filter(p=>p.kind!=='material'),'amount');
  const receivedMat=sum(pays.filter(p=>p.kind==='material'),'amount');
  const ex=S.expenses.filter(e=>e.objectId===id);
  const mat=sum(ex.filter(e=>MAT_CATS.includes(e.category)),'amount');
  const fuel=sum(ex.filter(e=>e.category==='Топливо'),'amount');
  const other=sum(ex.filter(e=>!MAT_CATS.includes(e.category)&&e.category!=='Топливо'),'amount');
  const wk=S.work.filter(w=>w.objectId===id),acc=wk.filter(w=>w.type!=='payout');
  const hired=acc.filter(w=>!isPartner(w.worker)),own=acc.filter(w=>isPartner(w.worker));
  const wages=sum(hired,'amount'),paidOut=sum(wk.filter(w=>w.type==='payout'&&!isPartner(w.worker)),'amount');
  const done=sum(acc,'client')||0,ownDone=sum(own,'client');
  const received=receivedWork+receivedMat,spent=fuel+other,cost=wages+spent;
  /* материалы — за счёт заказчика: в прибыль не входят, считаются отдельно */
  const matBal=receivedMat-mat,matOwes=Math.max(0,-matBal);
  const taken=sum(S.cash.filter(c=>c.type==='take'&&c.objectId===id),'amount')+sum(wk.filter(w=>w.type==='payout'&&isPartner(w.worker)),'amount');
  const profit=receivedWork-cost,profitDone=Math.max(done,receivedWork)-cost;
  return {receivedWork,receivedMat,received,mat,fuel,other,spent,wages,paidOut,done,ownDone,cost,taken,
    profit,profitDone,left:profit-taken-matOwes,clientOwes:done-receivedWork,matBal,matOwes};
}
function workerNames(){
  const s=new Set(S.workers.map(w=>w.name));S.work.forEach(w=>w.worker&&s.add(w.worker));
  const last={};S.work.forEach(w=>{if(w.worker)last[w.worker]=Math.max(last[w.worker]||0,w.ts||0)});
  return [...s].sort((a,b)=>(last[b]||0)-(last[a]||0)||a.localeCompare(b));
}
function workerStat(name,objId){
  const r=S.work.filter(x=>x.worker===name&&(!objId||x.objectId===objId));
  const earned=sum(r.filter(x=>x.type!=='payout'),'amount'),paid=sum(r.filter(x=>x.type==='payout'),'amount');
  return {rows:r,earned,paid,debt:earned-paid};
}
function weekStart(){const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function perKm(st){const f=st.fuel||'gas';return (num(st.cons[f])/100)*num(st.price[f])*(1+num(st.amort)/100)}
function dayStats(d){
  if(d.end==null||d.start==null)return null;
  const km=((+d.end)-(+d.start)+1000)%1000;
  const trips=S.expenses.filter(e=>e.trip&&e.date===d.date&&(!d.by||!e.by||d.by===e.by));
  const objKm=trips.reduce((s,e)=>s+(+e.trip.km||0)*(e.trip.roundtrip?2:1),0);
  const liters=km*(+d.cons||0)/100,fuel=liters*(+d.price||0),total=fuel*(1+(+d.amort||0)/100);
  const idleKm=Math.max(0,km-objKm);
  return {km,objKm,idleKm,liters:r2(liters),fuel,total,idle:km?total*idleKm/km:0,over:objKm>km};
}
const taskLate=t=>!t.done&&t.due&&t.due<today();

/* ================= навигация ================= */
const ui={tab:'today',schedMode:'cal',week:0,objTab:'main',phF:'all',phStage:'',page:[],objF:'active',taskF:'all',showDone:false,showAllWork:false};
const sheets=[];let SS={};
function curPage(){return ui.page[ui.page.length-1]||null}
function openPage(p){ui.page.push(p);history.pushState({p:1},'');render();window.scrollTo(0,0)}
function openSheet(fn){sheets.push(fn);history.pushState({s:1},'');drawSheet()}
function replaceSheet(fn){sheets[sheets.length-1]=fn;drawSheet()}
let closing=0,ignorePop=0;
function closeAllSheets(){const n=sheets.length;if(!n)return;sheets.length=0;drawSheet();ignorePop++;history.go(-n)}
function back(){if(closing)return;closing=1;history.back();setTimeout(()=>closing=0,350)}
/* закрыть верхнее окно и выполнить fn, когда оно реально закрылось (на iPhone popstate приходит с задержкой) */
function backThen(fn){const n=sheets.length;if(!n){fn();return}closing=0;back();let t=0;
  const chk=()=>{if(sheets.length<n){setTimeout(fn,30);return}if(++t>48){sheets.length=Math.max(0,n-1);ignorePop++;drawSheet();render();setTimeout(fn,30);return}setTimeout(chk,25)};setTimeout(chk,25)}
const backP=()=>new Promise(r=>backThen(r));
window.addEventListener('popstate',()=>{
  if(document.querySelector('.ped,.qrscan:not(.out)'))return;
  closing=0;if(ignorePop>0){ignorePop--;return}
  if(viewerEl){viewerEl.remove();viewerEl=null;return}
  if(sheets.length){sheets.pop();drawSheet();render();return}
  if(ui.page.length){ui.page.pop();render()}
});
function drawSheet(){
  const fn=sheets[sheets.length-1];
  if(!fn){SS={};document.body.classList.remove('lock');
    const fin=()=>{sheetRoot.classList.remove('open','closing','anim');sheetRoot.innerHTML='';flushRender()};
    if(sheetRoot.classList.contains('open')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){sheetRoot.classList.add('closing');clearTimeout(drawSheet.t);drawSheet.t=setTimeout(()=>{if(!sheets.length)fin()},260)}else fin();
    return}
  clearTimeout(drawSheet.t);const wasOpen=sheetRoot.classList.contains('open')&&!sheetRoot.classList.contains('closing');sheetRoot.classList.remove('closing');
  if(!wasOpen){sheetRoot.classList.add('anim');clearTimeout(drawSheet.a);drawSheet.a=setTimeout(()=>sheetRoot.classList.remove('anim'),520)}
  SS={};const r=fn();
  sheetRoot.innerHTML=`<div class="scrim" data-a="close"></div><div class="sh" role="dialog" aria-modal="true"><div class="shh"><b>${esc(r.title)}</b><button class="ico" data-a="close" aria-label="Закрыть">✕</button></div><div class="shb">${r.html}</div></div>`;
  sheetRoot.classList.add('open');document.body.classList.add('lock');
  r.init&&r.init();
}

/* ================= рендер ================= */
let pendingRender=false;
const typing=()=>{const a=document.activeElement;return !!(a&&view.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
function softRender(){if(typeof chatLive==='function'&&chatLive())return;if(typing()||sheets.length){pendingRender=true;return}render()}
function flushRender(){if(pendingRender){pendingRender=false;render()}}
const LI=(main,sub,right,a,id,rsub='',cls='')=>`<button class="li" data-a="${a}" data-id="${esc(id)}"><span class="t"><b>${main}</b>${sub?`<small>${sub}</small>`:''}</span><span class="r"><span class="n ${cls}">${right}</span>${rsub?`<small>${rsub}</small>`:''}</span></button>`;
const chip=(t,on,a,id,extra='')=>`<button class="chip ${on?'on':''}" data-a="${a}" data-id="${esc(id)}" ${extra}>${t}</button>`;
const byTag=x=>x.by&&x.by!==me()?' · '+esc(x.by):'';

function workTitle(w){return w.title||(OLD_KINDS[w.kind]||['Работа'])[0]}
function workLi(w,showObj){
  if(w.type==='payout')return LI('Выплата'+(w.items&&w.items.length?` · ${w.items.length} работ`:'')+(w.note?' · '+esc(w.note):''),`${fdate(w.date)} · ${esc(w.worker)}${showObj&&w.objectId?' · '+esc(oname(w.objectId)):''}${byTag(w)}`,'−'+money(w.amount),'editWork',w.id,'','pos');
  const unit=w.unit||(OLD_KINDS[w.kind]||[])[1]||'';
  const q=w.kind==='fixed'||w.kind==='deal'?'':`${qf(w.qty)} ${esc(unit)} · `;
  return LI(esc(workTitle(w)),`${fdate(w.date)} · ${q}${esc(w.worker)}${showObj?' · '+esc(oname(w.objectId)):''}${byTag(w)}`,money(w.amount),'editWork',w.id,w.client?'заказчику '+money(w.client):'');
}
function expLi(e){
  const t=e.trip?`${e.trip.km} км${e.trip.roundtrip?' ×2':''}`:esc(e.category);
  return LI(esc(e.title||e.category),`${fdate(e.date)} · ${t}${e.photos&&e.photos.length?' · 📷'+e.photos.length:''}${byTag(e)}`,money(e.amount),'editExp',e.id);
}
function taskSort(a,b){return (a.done-b.done)||String(a.due||'9999').localeCompare(String(b.due||'9999'))||((a.ts||0)-(b.ts||0))}
function taskRow(t,showObj){
  const meta=[showObj===true&&t.objectId?esc(oname(t.objectId)):'',t.who?'👤 '+esc(t.who):'',t.due?`<span class="${taskLate(t)?'neg':''}">до ${fdate(t.due)}</span>`:''].filter(Boolean).join(' · ');
  return `<div class="task ${t.done?'done':''}"><button class="ck" data-a="tick" data-id="${t.id}" aria-label="Готово"><i>${t.done?'✓':''}</i></button><button class="tt" data-a="editTask" data-id="${t.id}">${esc(t.title)}${meta?`<small>${meta}</small>`:''}</button></div>`;
}

function vTasks(){
  const names=[...new Set([me(),...S.tasks.map(t=>t.who)].filter(Boolean))];
  const f=ui.taskF;
  const list=S.tasks.filter(t=>f==='all'||(f==='none'?!t.who:t.who===f));
  const open=list.filter(t=>!t.done).sort(taskSort),done=list.filter(t=>t.done).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,30);
  const chips=chip('Все',f==='all','taskF','all')+names.map(n=>chip(n===me()?'Мои':esc(n),f===n,'taskF',n)).join('')+chip('Без исполнителя',f==='none','taskF','none');
  const late=open.filter(taskLate),td=open.filter(t=>t.due===today());
  const groups={};open.forEach(t=>{(groups[t.objectId||'']=groups[t.objectId||'']||[]).push(t)});
  const body=Object.keys(groups).length?Object.entries(groups).map(([oid,ts])=>`<h2>${esc(oid?oname(oid):'Без объекта')} <small>${ts.length}</small></h2><div class="list">${ts.map(taskRow).join('')}</div>`).join(''):'<div class="card empty">Открытых задач нет 👍</div>';
  return `<div class="wrap"><div class="chips">${chips}</div>
   ${late.length||td.length?`<div class="card sm">${late.length?`<b class="neg">Просрочено: ${late.length}</b> `:''}${td.length?`<b>На сегодня: ${td.length}</b>`:''}</div>`:''}
   ${body}
   ${done.length?`<h2>Выполненные <small>последние</small></h2><div class="list">${done.map(t=>taskRow(t,true)).join('')}</div>`:''}</div>`;
}

function vWorkers(){
  const names=workerNames();
  const ws=weekStart();
  if(!names.length)return `<div class="wrap"><div class="card empty"><p><b>Рабочих пока нет</b></p><p>Нажми «+ Работа» — рабочего можно добавить прямо в форме.</p></div></div>`;
  const rows=names.map(n=>{const s=workerStat(n);const wk=sum(s.rows.filter(x=>x.type!=='payout'&&x.date>=ws),'amount');
    return LI(esc(n),`за неделю ${money(wk)} · всего ${money(s.earned)}`,money(s.debt),'openWorker',n,s.debt>0?'к выплате':s.debt<0?'переплата':'рассчитан',s.debt>0?'warn':'')}).join('');

function rateMatches(q){
  q=q.trim().toLowerCase();
  if(!q){const rec=S.settings.recent.map(id=>S.rates.find(r=>r.id===id)).filter(Boolean);const rest=S.rates.filter(r=>!rec.includes(r)).sort((a,b)=>String(a.cat).localeCompare(String(b.cat))||a.name.localeCompare(b.name));return rec.concat(rest)}
  const ws=q.split(/\s+/);
  return S.rates.filter(r=>{const s=(r.name+' '+(r.cat||'')).toLowerCase();return ws.every(w=>s.includes(w))});
}
function drawRateList(q){
  const list=rateMatches(q);const rec=new Set(S.settings.recent);

  const f=q*(cp-wp);g('rF').textContent=money(f);g('rF').className='n '+(f<0?'neg':'');
}

  put('work',{...old,id,type:'accrual',kind:'piece',objectId:SS.obj,worker:SS.wk,date:v('wd')||today(),rateId:r.id||null,title:r.name,unit:r.unit,qty:q,rate:wp,amount:r2(q*wp),cprice:cp,client:r2(q*cp),note:v('wn').trim()});
  if(r.id)S.settings.recent=[r.id,...S.settings.recent.filter(x=>x!==r.id)].slice(0,8);
  S.settings.lastObj=SS.obj;S.settings.lastWorker=SS.wk;
  commit();
  toast(`Записано: ${SS.wk} +${money(q*wp)}`);

}

let sb=null,chan=null,syncing=false,again=false,syncT=null,session=null,online=navigator.onLine;
function schedule(ms){clearTimeout(syncT);syncT=setTimeout(syncNow,ms)}
function pendN(){return Object.keys(SY.pend).length+Object.keys(SY.ph).length}
function setStatus(){
  const el=$('#sync');if(!el)return;let s,t;const n=pendN();
  if(!sb||!session){s='off';t=SY.url?'Войти':'Без синхр.'}
  else if(syncing){s='busy';t=n?'↑ '+n:'…'}
  else if(!online||/fetch|network|load failed|timeout/i.test(SY.err||'')){s='pend';t='Офлайн'+(n?' · '+n:'')}
  else if(SY.err){s='err';t='Ошибка'}

function initSb(){
  if(sb||!SY.url||!SY.key||!window.supabase)return !!sb;
  try{sb=window.supabase.createClient(SY.url,SY.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'stroyka-auth'},realtime:{params:{eventsPerSecond:5}}})}catch(e){SY.err=e.message;return false}
  sb.auth.onAuthStateChange((ev,s)=>{const was=session;session=s;if(s){SY.email=s.user.email;saveSync();subscribe();schedule(50);if(!was)fetchRole()}else{unsubscribe()}setStatus()});
  return true;
}
function subscribe(){
  if(chan||!sb)return;
  chan=sb.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:'records'},p=>{
    try{
      if(p.eventType==='DELETE'){const k=p.old&&p.old.id;if(!k||SY.pend[k]||k.startsWith('img/'))return;const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);if(S[c]){S[c]=S[c].filter(x=>x.id!==id);saveLocal();softRender()}return}
      const r=p.new;if(!r||!r.data||SY.pend[r.id]||r.col==='img')return;const c=r.col;S[c]=S[c]||[];
      if(SY.role==='worker'&&typeof wkKeep==='function'){const d=wkKeep(c,r.data);if(!d){const j=S[c].findIndex(x=>x.id===r.data.id);if(j>=0){S[c].splice(j,1);saveLocal();softRender()}return}r.data=d}
      const i=S[c].findIndex(x=>x.id===r.data.id);i<0?S[c].push(r.data):S[c][i]=r.data;
      if(c==='objects'&&r.data.tasks&&r.data.tasks.length)setTimeout(()=>{if(migrate())commit()},300);
      saveLocal();if(c==='msgs'&&typeof onMsg==='function')onMsg(r.data,i<0);softRender();
    }catch(e){console.error(e)}
  }).subscribe(st=>{if(st==='SUBSCRIBED')schedule(100)});
}
function unsubscribe(){if(chan&&sb){sb.removeChannel(chan)}chan=null}
async function push(){
  if(SY.role==='worker'){Object.keys(SY.pend).forEach(k=>{const c=k.slice(0,k.indexOf('/'));if(!['tasks','expenses','msgs','photos'].includes(c)||(SY.deny||{})[c])delete SY.pend[k]});return pushWorker()}
  const keys=Object.keys(SY.pend);if(!keys.length)return;
  const snap={...SY.pend},ups=[],ins=[],dels=[];
  for(const k of keys){const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);const r=(S[c]||[]).find(x=>x.id===id);
    if(r){(r.ts===0?ins:ups).push({id:k,col:c,data:r,updated_at:Date.now()})}else dels.push(k)}
  for(let i=0;i<ups.length;i+=200){const {error}=await sb.from('records').upsert(ups.slice(i,i+200),{onConflict:'id'});if(error)throw error}
  for(let i=0;i<ins.length;i+=200){const {error}=await sb.from('records').upsert(ins.slice(i,i+200),{onConflict:'id',ignoreDuplicates:true});if(error)throw error}
  for(let i=0;i<dels.length;i+=200){const {error}=await sb.from('records').delete().in('id',dels.slice(i,i+200));if(error)throw error}
  for(const k of keys)if(SY.pend[k]===snap[k])delete SY.pend[k];
  saveSync();
}
/* рабочий: отправляем по разделам, чтобы запрет сервера на один раздел не блокировал остальные */
async function pushWorker(){
  const keys=Object.keys(SY.pend);if(!keys.length)return;const snap={...SY.pend},by={};
  keys.forEach(k=>{const c=k.slice(0,k.indexOf('/'));(by[c]=by[c]||[]).push(k)});
  let fail=null;
  for(const c in by){const ups=[],dels=[];
    for(const k of by[c]){const id=k.slice(c.length+1),r=(S[c]||[]).find(x=>x.id===id);r?ups.push({id:k,col:c,data:r,updated_at:Date.now()}):dels.push(k)}
    try{
      if(ups.length){const {error}=await sb.from('records').upsert(ups,{onConflict:'id'});if(error)throw error}
      if(dels.length){const {error}=await sb.from('records').delete().in('id',dels);if(error)throw error}
      by[c].forEach(k=>{if(SY.pend[k]===snap[k])delete SY.pend[k]});
    }catch(e){const m=(e&&(e.message||e.code))||String(e);
      if(/row-level|security|permission|42501|denied|policy/i.test(m)){SY.deny=SY.deny||{};SY.deny[c]=1;by[c].forEach(k=>delete SY.pend[k])}else fail=e}
  }
  saveSync();if(fail)throw fail;
}
async function pull(){
  const rows=[];
  for(let p=0;;p++){const {data,error}=await sb.from('records').select('id,col,data').neq('col','img').range(p*1000,p*1000+999);if(error)throw error;rows.push(...data);if(data.length<1000)break}
  const by={};rows.forEach(r=>{if(r.data&&r.col)(by[r.col]=by[r.col]||[]).push(r.data)});
  const cols=new Set([...COLS,...Object.keys(by)]);
  for(const c of cols){
    const pendIds=new Set(Object.keys(SY.pend).filter(k=>k.startsWith(c+'/')).map(k=>k.slice(c.length+1)));
    const local=(S[c]||[]).filter(x=>pendIds.has(x.id));
    S[c]=(by[c]||[]).filter(x=>!pendIds.has(x.id)).concat(local);
  }
  if(SY.role==='worker'&&typeof wkPrune==='function')wkPrune();
  saveLocal();
}
async function pushPhotos(){
  for(const id of Object.keys(SY.ph)){
    const d=await idbGet(id).catch(()=>null);
    if(!d){delete SY.ph[id];continue}
    const {error}=await sb.from('records').upsert({id:'img/'+id,col:'img',data:{id,d},updated_at:Date.now()},{onConflict:'id'});
    if(error){SY.phErr=error.message;break}
    delete SY.ph[id];SY.phErr='';
  }
  saveSync();
}
async function syncNow(){
  if(!initSb()||!session)return setStatus();
  if(syncing){again=true;return}
  syncing=true;setStatus();
  try{
    await push();await pull();
    if(migrate())await push();
    await pushPhotos().catch(e=>SY.phErr=e.message);
    SY.err='';SY.last=Date.now();setTimeout(()=>autoBackup(),2000);
  }catch(e){SY.err=(e&&(e.message||e.error_description))||String(e);console.error(e);
    if(SY.role==='worker'){Object.keys(SY.pend).forEach(k=>{if(k.startsWith('tasks/'))delete SY.pend[k]})}}
  syncing=false;saveSync();setStatus();softRender();
  if(sheets.length&&SS.syncView)SS.syncView();
  if(again){again=false;schedule(300)}
}

const MK=Object.fromEntries(MARKET.map(r=>[r[0],{id:r[0],cat:r[1],name:r[2],unit:r[3],min:r[4],max:r[5],avg:r[6]}]));
const MK_LIST=MARKET.map(r=>MK[r[0]]);
const MK_CATS=[...new Set(MARKET.map(r=>r[1]))];
const MKS=()=>({coef:0.9,level:'avg',share:50,...(S.settings.mkt||{})});
const LEVELN={min:'минимальную',avg:'среднюю',max:'максимальную'};
const roundP=x=>{x=+x||0;return x<200?Math.round(x/5)*5:Math.round(x/10)*10};
const mkBase=(m,st)=>st.level==='min'?m.min:st.level==='max'?m.max:m.avg;
function mkClient(m,st=MKS()){return roundP(mkBase(m,st)*st.coef)}
function mkWorker(c,st=MKS()){return roundP(c*st.share/100)}
function mkRange(m,st=MKS()){return [roundP(m.min*st.coef),roundP(m.max*st.coef)]}
function mkStatus(r){
  const m=r.mk&&MK[r.mk];if(!m)return null;
  const st=MKS(),[a,b]=mkRange(m,st),c=+r.client||0;
  return {m,a,b,c,client:mkClient(m,st),worker:mkWorker(mkClient(m,st),st),low:c>0&&c<a,high:c>b,unitBad:r.unit!==m.unit};
}
function mkHintText(r){const s=mkStatus(r);if(!s)return '';return `рынок ${s.a}–${s.b} ₴/${s.m.unit}${s.unitBad?' · ⚠ единица':s.low?' · ниже рынка':s.high?' · выше рынка':''}`}
function mkHintHtml(r){const s=mkStatus(r);if(!s)return '<span class="muted">не привязано к рынку</span>';
  const bad=s.unitBad||s.low||s.high;
  return `<span class="${bad?'warn':'muted'}">рынок ${s.a}–${s.b} ₴/${esc(s.m.unit)}${s.unitBad?` · ⚠ у вас «${esc(r.unit)}», на рынке «${esc(s.m.unit)}»`:s.low?' · ниже рынка':s.high?' · выше рынка':''}</span>`}

const mkByName=(n,u)=>{const m=MK_LIST.find(x=>x.name===n&&(!u||x.unit===u))||MK_LIST.find(x=>x.name===n);return m?m.id:null};
function linkSeeds(){
  if(S.settings.mkLinked)return;S.settings.mkLinked=1;
  const fresh=!S.work.length&&S.rates.every(r=>r.ts===0);
  S.rates.forEach(r=>{if(r.mk)return;const t=SEED_LINK[r.name];const id=t&&mkByName(t);if(!id)return;
    r.mk=id;if(fresh){const m=MK[id],c=mkClient(m);r.client=c;r.worker=mkWorker(c);r.unit=m.unit;mark('rates',r.id)}else put('rates',r)});
  if(fresh)S.settings.mkAsked=MARKET_DATE;
  saveLocal();saveSync();
}
function repriceList(){return S.rates.map(r=>({r,s:mkStatus(r)})).filter(x=>x.s&&(x.s.client!==+x.r.client||x.s.worker!==+x.r.worker||x.s.unitBad))}

/* ---------- прайс ---------- */
function ratesSheet(){return ()=>{
  const st=MKS(),diff=repriceList().length,unl=S.rates.filter(r=>!r.mk).length;
  return {title:'Прайс работ',html:`<div class="card sm">
     <b>Цены по рынку</b> · ${MARKET_SRC}<br><span class="muted">для вас: ×${st.coef} от цен Днепра, берём ${LEVELN[st.level]}, рабочему ${st.share}% от цены заказчику</span>
     <div class="btns" style="margin-top:8px"><button class="btn" data-s="mset">Настроить</button><button class="btn ${diff?'p':''}" data-s="rep">Обновить по рынку${diff?' ('+diff+')':''}</button></div></div>
   <div class="btns" style="margin-top:0"><button class="btn p" data-s="mkt">＋ Из справочника (${MK_LIST.length})</button><button class="btn" data-s="newR">＋ Своя</button></div>
   <input id="prq" placeholder="Поиск по моему прайсу…" autocomplete="off" style="margin-top:10px">
   ${unl?`<p class="muted sm">Без привязки к рынку: ${unl}. Открой позицию → «Найти на рынке», чтобы видеть нормальный диапазон.</p>`:''}
   <div id="prl" style="margin-top:4px"></div>`,
  init(){
    const draw=q=>{const l=rateMatches(q).slice().sort((a,b)=>String(a.cat).localeCompare(String(b.cat))||a.name.localeCompare(b.name));let cat=null,h='';
      l.forEach(r=>{if(r.cat!==cat){if(cat!==null)h+='</div>';cat=r.cat;h+=`<h2>${esc(cat||'Без группы')}</h2><div class="list">`}
        h+=`<button class="li" data-s="editR" data-id="${r.id}"><span class="t"><b>${esc(r.name)}</b><small>за ${esc(r.unit)} · ${mkHintHtml(r)}</small></span><span class="r"><span class="n">${money(r.client)}</span><small>рабочему ${money(r.worker)}</small></span></button>`});
      g('prl').innerHTML=(h?h+'</div>':'<p class="empty">Ничего нет</p>')};
    draw('');SS.input=ev=>{if(ev.target.id==='prq')draw(ev.target.value)};
    SS.newR=()=>openSheet(rateSheet(null,v('prq')));
    SS.editR=el=>openSheet(rateSheet(el.dataset.id));
    SS.mkt=()=>openSheet(marketSheet());SS.rep=()=>openSheet(repriceSheet());SS.mset=()=>openSheet(mktSettingsSheet());
  }};
}}
function marketSheet(linkTo,q0=''){return ()=>{
  const st=MKS();
  return {title:linkTo?'Найти на рынке':'Справочник цен',html:`<p class="muted sm">${MARKET_SRC}: диапазон цен мастеров и средняя. «Для вас» — с вашими настройками (×${st.coef}, ${LEVELN[st.level]}).</p>
   <input id="mq" placeholder="Поиск: штроба, плитка, забор, септик…" autocomplete="off" value="${esc(q0)}">
   <div class="chips" id="mcC" style="margin-top:8px">${chip('Все',true,'mc','','data-s="1"')}${MK_CATS.map(c=>chip(esc(c),false,'mc',c,'data-s="1"')).join('')}</div>
   <div id="ml"></div>`,
  init(){
    SS.mcat='';
    const draw=()=>{const q=v('mq').trim().toLowerCase(),ws=q.split(/\s+/).filter(Boolean);
      const l=MK_LIST.filter(m=>(!SS.mcat||m.cat===SS.mcat)&&ws.every(w=>(m.name+' '+m.cat).toLowerCase().includes(w)||(w.length>4&&(m.name+' '+m.cat).toLowerCase().includes(w.slice(0,w.length-1)))));
      const have=new Set(S.rates.map(r=>r.mk).filter(Boolean));let cat=null,h='';
      l.slice(0,150).forEach(m=>{if(m.cat!==cat){if(cat!==null)h+='</div>';cat=m.cat;h+=`<h2>${esc(cat)}</h2><div class="list">`}
        const c=mkClient(m,st);
        h+=`<button class="li" data-s="pick" data-id="${m.id}"><span class="t"><b>${have.has(m.id)&&!linkTo?'✓ ':''}${esc(m.name)}</b><small>за ${esc(m.unit)} · рынок ${m.min}–${m.max}, ср. ${m.avg}</small></span><span class="r"><span class="n">${money(c)}</span><small>рабочему ${money(mkWorker(c,st))}</small></span></button>`});
      g('ml').innerHTML=h?h+'</div>':'<p class="empty">Не найдено</p>'};
    draw();
    SS.input=ev=>{if(ev.target.id==='mq')draw()};
    SS.mc=el=>{SS.mcat=el.dataset.id;setChip('mcC',SS.mcat);draw()};
    SS.pick=el=>{const m=MK[el.dataset.id];if(!m)return;const c=mkClient(m,st);
      if(linkTo){const r=S.rates.find(x=>x.id===linkTo);if(!r)return;r.mk=m.id;
        if(confirm(`Привязать к «${m.name}» (за ${m.unit}).\nВзять рыночную цену: заказчику ${money(c)}, рабочему ${money(mkWorker(c,st))}?\n\n«Отмена» — оставить свои цены.`)){r.client=c;r.worker=mkWorker(c,st);r.unit=m.unit}
        put('rates',r);commit(true);toast('Привязано к рынку');back();return}
      const ex=S.rates.find(r=>r.mk===m.id);if(ex){toast('Уже в прайсе: '+ex.name);return}
      put('rates',{id:uid(),cat:m.cat,name:m.name,unit:m.unit,client:c,worker:mkWorker(c,st),mk:m.id});commit(true);
      el.querySelector('b').textContent='✓ '+m.name;toast(`В прайсе: ${money(c)} за ${m.unit}`)};
  }};
}}
function repriceSheet(){return ()=>{
  S.settings.mkAsked=MARKET_DATE;saveLocal();
  const l=repriceList(),st=MKS();
  return {title:'Обновить цены по рынку',html:`<p class="muted sm">${MARKET_SRC} · ×${st.coef} · цена: ${({min:'минимальная',avg:'средняя',max:'максимальная'})[st.level]} · рабочему ${st.share}%. Отметь, что обновить.</p>
   ${l.length?`<div class="list">${l.map(({r,s},i)=>`<label class="li" style="cursor:pointer"><input type="checkbox" class="rpc" data-i="${i}" checked style="width:22px;min-height:22px;flex:none"><span class="t"><b>${esc(r.name)}</b>
      <small style="white-space:normal">заказчику ${money(r.client)} → <span class="n">${money(s.client)}</span> · рабочему ${money(r.worker)} → <span class="n">${money(s.worker)}</span>${s.unitBad?` · <span class="n warn">единица ${esc(r.unit)} → ${esc(s.m.unit)}</span>`:''}</small></span></label>`).join('')}</div>
      <div class="btns"><button class="btn" data-s="none">Снять все</button><button class="btn p" data-s="apply">Обновить отмеченные</button></div>`
     :'<p class="empty">Все цены совпадают с рынком 👍</p>'}
   <p class="muted sm">Уже записанные работы не меняются — новые цены будут в новых записях и сметах.</p>`,
  init(){
    SS.none=()=>document.querySelectorAll('.rpc').forEach(c=>c.checked=false);
    SS.apply=()=>{let n=0;document.querySelectorAll('.rpc').forEach(c=>{if(!c.checked)return;const {r,s}=l[+c.dataset.i];r.client=s.client;r.worker=s.worker;r.unit=s.m.unit;put('rates',r);n++});
      commit(true);toast(`Обновлено позиций: ${n}`);back()};
  }};
}}
function mktSettingsSheet(){return ()=>{
  const st=MKS();
  return {title:'Как считать цены',html:`
   ${F('Коэффициент региона (от цен Днепра)',`<div class="chips" id="kfC">${[0.8,0.85,0.9,0.95,1].map(k=>chip('×'+k,st.coef===k,'kf',String(k),'data-s="1"')).join('')}</div>${N('kfv',st.coef)}`,'Кривой Рог обычно немного дешевле Днепра — по умолчанию ×0,9. Поставь ×1, если работаете по днепровским ценам.')}
   ${F('Какую цену брать',`<div class="chips" id="lvC">${Object.entries({min:'Минимальную',avg:'Среднюю',max:'Максимальную'}).map(([k,t])=>chip(t,st.level===k,'lv',k,'data-s="1"')).join('')}</div>`)}
   ${F('Рабочему, % от цены заказчику',`<div class="chips" id="shC">${[40,45,50,55,60].map(k=>chip(k+'%',st.share===k,'sh',String(k),'data-s="1"')).join('')}</div>${N('shv',st.share)}`,'Остальное — фирме: инструмент, дорога, материалы на мелочи, прибыль.')}
   <div class="card sm" id="mex"></div>
   <div class="btns"><button class="btn p" data-s="save">Сохранить</button></div>`,
  init(){
    SS.lv_=st.level;
    const ex=()=>{const s={coef:num(v('kfv'))||1,level:SS.lv_,share:num(v('shv'))||50},m=MK[mkByName('Штробление под проводку в кирпиче, глубина 2 см')],c=mkClient(m,s);
      g('mex').innerHTML=`Пример: штроба в кирпиче — рынок ${m.min}–${m.max}, ср. ${m.avg} ₴/п.м. → заказчику <b>${money(c)}</b>, рабочему <b>${money(mkWorker(c,s))}</b>, фирме ${money(c-mkWorker(c,s))}`};
    ex();SS.input=ex;
    SS.kf=el=>{g('kfv').value=el.dataset.id;setChip('kfC',el.dataset.id);ex()};
    SS.lv=el=>{SS.lv_=el.dataset.id;setChip('lvC',el.dataset.id);ex()};
    SS.sh=el=>{g('shv').value=el.dataset.id;setChip('shC',el.dataset.id);ex()};
    SS.save=()=>{S.settings.mkt={coef:Math.min(2,Math.max(0.3,num(v('kfv'))||1)),level:SS.lv_,share:Math.min(95,Math.max(5,num(v('shv'))||50))};saveLocal();toast('Сохранено — «Обновить по рынку», чтобы пересчитать прайс');back()};
  }};
}}
function rateSheet(id,name=''){return ()=>{
  const r=S.rates.find(x=>x.id===id)||{name,unit:'м²',cat:'',worker:'',client:''};
  const cats=[...new Set([...S.rates.map(x=>x.cat),...MK_CATS].filter(Boolean))];
  const s=mkStatus(r),st=MKS();
  return {title:id?'Работа в прайсе':'Новая работа',html:`
   ${F('Название',I('rn',r.name))}
   <div class="two">${F('Единица',`<select id="ru">${[...new Set([...UNITS,'т','кг',r.unit])].map(u=>`<option ${u===r.unit?'selected':''}>${esc(u)}</option>`).join('')}</select>`)}${F('Группа',I('rc',r.cat,'list="rcl"')+`<datalist id="rcl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`)}</div>
   <div class="two">${F('Заказчику за ед., ₴',N('rcl2',r.client))}${F('Рабочему за ед., ₴',N('rw',r.worker))}</div>
   <div class="chips" style="margin-top:6px">${[40,50,60].map(k=>`<button class="chip" style="height:32px" data-s="pct" data-id="${k}">рабочему ${k}%</button>`).join('')}</div>
   <p class="muted sm" id="rmg"></p>
   ${id?`<div class="card sm">${s?`<b>Рынок:</b> ${esc(s.m.name)}<br>за ${esc(s.m.unit)} · ${s.m.min}–${s.m.max} ₴, ср. ${s.m.avg} (${MARKET_SRC})<br>для вас: заказчику <b>${money(s.client)}</b>, рабочему <b>${money(s.worker)}</b>
       ${s.unitBad?`<br><b class="warn">⚠ Единица не совпадает: у вас «${esc(r.unit)}», на рынке «${esc(s.m.unit)}» — цены несопоставимы</b>`:''}
       <div class="btns" style="margin-top:8px"><button class="btn p" data-s="take">Взять рыночную</button><button class="btn" data-s="unl">Отвязать</button></div>`
     :`Не привязано к рынку — не видно, нормальная ли цена.<div class="btns" style="margin-top:8px"><button class="btn p" data-s="find">Найти на рынке</button></div>`}</div>`:''}
   <div class="btns">${delBtn(!!id)}<button class="btn p" data-s="save">Сохранить</button></div>`,
  init(){
    const m=()=>{const w=num(v('rw')),c=num(v('rcl2'));g('rmg').textContent=c?`Фирме остаётся ${money(c-w)} с единицы (${Math.round((c-w)/c*100)}%)`:''};m();SS.input=m;
    if(!id)setTimeout(()=>{const _e=g('rn');_e&&_e.focus()},80);
    SS.pct=el=>{g('rw').value=roundP(num(v('rcl2'))*el.dataset.id/100);m()};
    SS.take=()=>{g('rcl2').value=s.client;g('rw').value=s.worker;g('ru').value=s.m.unit;m();toast('Рыночная цена подставлена — сохрани')};
    SS.unl=()=>{delete r.mk;put('rates',r);commit(true);replaceSheet(rateSheet(id))};
    SS.find=()=>openSheet(marketSheet(id,(r.name||'').split(/\s+/)[0]));
    SS.save=()=>{const n=v('rn').trim();if(!n){toast('Название');return}
      put('rates',{...r,id:id||uid(),name:n,unit:v('ru'),cat:v('rc').trim()||'Прочее',worker:num(v('rw')),client:num(v('rcl2'))});commit();back()};
    SS.del=()=>{if(confirm('Удалить из прайса? Записанные работы останутся.')){del('rates',id);commit();back()}};
  }};
}}

    if(k!==1){wp.price=Math.round(wp.price*k);wp.worker=Math.round(wp.worker*k);wp.title=wp.title+` (×${String(k).replace('.',',')})`}
    return {n,q:r2(q),...wp,sum:r2(q)*wp.price,wsum:r2(q)*wp.worker}});

function calcToEst(objectId,rows){

  if(!rows.mats.length&&!rows.works.length){toast('Нечего добавлять');return false}
  if(!confirm(`Добавить в смету объекта ${rows.mats.length} материалов и ${rows.works.length} работ? Если строка уже есть — количество прибавится.`))return false;
  const addLine=(kind,title,unit,qty,price,rateId)=>{const ex=S.est.find(e=>e.objectId===objectId&&e.kind===kind&&e.title===title&&e.unit===unit);
    if(ex){ex.qty=r2((+ex.qty||0)+qty);if(price)ex.price=price;put('est',ex)}else put('est',{id:uid(),objectId,kind,ok:false,rateId:rateId||null,title,unit,qty:r2(qty),price:price||0})};

/* голос: «зал 5 на 4 высота 2,7 окно 1,5 на 1,4 дверь гкл вата» */
function parseCalcCmd(t){
  const low=t.toLowerCase().replace(/,/g,'.');
  const kw={wproof:/гидроизол/,self:/налив/,linol:/линол/,gklw:/(гкл|гипсокарт|зашить|обшить)/,gklc:/потол/,part:/перегород/,plaster:/штукат/,putty:/(шпакл|покрас)/,wallp:/обо[иья]/,tilew:/плитк[аиу]?\s*(на\s*)?стен/,tilef:/плитк[аиу]?\s*(на\s*)?пол/,screed:/стяжк/,lam:/ламинат/,block:/(газоблок|кладк)/};
  const sys=Object.keys(kw).filter(k=>kw[k].test(low));
  if(!sys.includes('tilew')&&!sys.includes('tilef')&&/плитк/.test(low))sys.push('tilef');
  const dim=low.match(/(\d+(?:\.\d+)?)\s*(?:на|x|х|×|\*)\s*(\d+(?:\.\d+)?)/);
  if(!dim||!sys.length)return null;
  if(sys.includes('gklc')&&sys.includes('gklw')&&!/стен/.test(low))sys.splice(sys.indexOf('gklw'),1);
  const rest=low.slice(low.indexOf(dim[0])+dim[0].length);
  const hm=low.match(/высот\S*\s*(\d+(?:\.\d+)?)/)||rest.match(/^\s*(?:на|x|х|×|\*)\s*(\d+(?:\.\d+)?)/);
  const ops=[];
  const wre=/окн\S*\s*(\d+(?:\.\d+)?)\s*(?:на|x|х|×|\*)\s*(\d+(?:\.\d+)?)/g;let mm;while((mm=wre.exec(low)))ops.push({t:'window',w:mm[1],h:mm[2],sill:'0.8',wall:String(ops.length%4+1)});
  const wn=low.match(/(?:^|\s)([1-5]|два|две|три)\s+окн/);if(!ops.some(o=>o.t==='window')&&/окн/.test(low)){const n={'два':2,'две':2,'три':3}[wn&&wn[1]]||(wn?+wn[1]:1);for(let i=0;i<n;i++)ops.push({t:'window',w:'1.5',h:'1.4',sill:'0.8',wall:String(i%4+1)})}
  const dre=/двер\S*\s*(\d+(?:\.\d+)?)\s*(?:на|x|х|×|\*)\s*(\d+(?:\.\d+)?)/g;let dd=0;while((mm=dre.exec(low))){ops.push({t:'door',w:mm[1],h:mm[2],sill:'0',wall:'3'});dd++}
  if(!dd&&/двер/.test(low)){const dn=low.match(/(?:^|\s)([1-5]|две|два)\s+двер/);const n={'две':2,'два':2}[dn&&dn[1]]||(dn?+dn[1]:1);for(let i=0;i<n;i++)ops.push({t:'door',w:'0.9',h:'2.0',sill:'0',wall:String((2+i)%4+1)})}
  const name=(t.trim().split(/\s+/)[0]||'');
  const c={...defCalc(),name:/^\d/.test(name)?'':name[0].toUpperCase()+name.slice(1),L:dim[1],W:dim[2],H:hm?hm[1]:'2.7',ops,sys};
  if(/вата|ват[уы]|утепл/.test(low)){c.p.wool=/100/.test(low)?'100':'50';c.p.ceilWool='1'}else c.p.wool='0';

  const scr=low.match(/стяжк\S*\s*(\d+)\s*см/);if(scr)c.p.scT=scr[1];
  return c;
}

const JOBG=['Внутри','Стены и фундамент','Крыша и фасад','Двор и участок'];
function jobDefaults(id){const v={};JOBS[id].f.forEach(([k,,d])=>v[k]=d);return v}
function runJob(id,v){
  const m={},works=[],notes=[],mat=(k,q)=>{if(q>0&&MATS[k])m[k]=(m[k]||0)+q},n=x=>Math.max(0,num(x));
  const M={n,mat,work:(nm,q,k)=>{if(q>0.001)works.push([nm,q,k||1])},note:t=>notes.push(t),
    reb:(d,len)=>{const k='reb'+d;mat(k,len*1.05);return len*1.05*(KGM[k]||0)},
    conc:(V,grade,how,noWork)=>{if(!(V>0))return;if(how==='hand'){const c=grade==='300'?[360,.45,.78]:[290,.5,.8];mat('cement',V*1.03*c[0]);mat('sand',V*1.03*c[1]);mat('gravel',V*1.03*c[2]);
        if(!noWork){M.work('Приготовление бетона',V);M.work('Бетонирование вручную (без приготовления раствора)',V)}}
      else{mat('conc'+(grade==='300'?'300':'200'),Math.ceil(V*1.03*10)/10);if(!noWork)M.work('Бетонирование из миксера',V)}}};
  try{JOBS[id].run(v,M)}catch(e){console.error(e);notes.push('Ошибка расчёта: '+e.message)}
  return {m,works,notes};
}

/* ---------- откосы: п.м. по наружному краю + площадь ---------- */
function slopeCalc(o){const cm=o.unit!=='m',f=x=>{const n=evalNum(x);return cm?n/100:n};
  const W=f(o.W),H=f(o.H),D=f(o.D),Wo=f(o.Wo)||W,Ho=f(o.Ho)||H,n=Math.max(1,Math.round(evalNum(o.n)||1)),sd=+o.sides||3;
  if(!(W>0||H>0)||!(D>0))return {lm:0,area:0,outer:0,text:''};
  const flW=Math.max(0,(Wo-W)/2),flH=Math.max(0,Ho-H),dS=Math.hypot(D,flW),dT=Math.hypot(D,flH);
  const sideL=Ho,topL=Wo,lm1=(sd>=2?2*sideL:0)+(sd>=3?topL:0)+(sd>=4?topL:0);
  const a1=(sd>=2?2*(H+Ho)/2*dS:0)+(sd>=3?(W+Wo)/2*dT:0)+(sd>=4?(W+Wo)/2*D:0);
  const outer1=(sd>=2?2*sideL:0)+(sd>=3?topL:0);
  const t=x=>String(r2(x)).replace('.',',');
  const text=`На один проём: ${sd>=2?`боковые 2 × ${t(sideL)}`:''}${sd>=3?` + верх ${t(topL)}`:''}${sd>=4?` + низ ${t(topL)}`:''} = ${t(lm1)} п.м. (по наружному краю), площадь ${t(a1)} м²${n>1?`. Проёмов: ${n}`:''}.`;
  return {lm:r2(lm1*n),area:r2(a1*n),outer:outer1*n,Dcm:Math.round(D*100),text,lm1,a1}}
const evalNum=x=>{let s=String(x==null?'':x).trim().replace(/,/g,'.').replace(/[×xх]/gi,'*').replace(/[^0-9.+\-*/() ]/g,'');if(!s)return 0;
  try{const r=Function('"use strict";return ('+s+')')();return isFinite(r)?+r:0}catch(e){return 0}};

const dimMode=(u,t)=>/откос/i.test(t||'')?'slope':/м²|м2|кв/i.test(u||'')?'area':/м³|м3|куб/i.test(u||'')?'vol':/^(п\.?\s?м\.?|м\.?\s?п\.?|пог|м|м\.)$/i.test(String(u||'').trim())||/пог/i.test(u||'')?'len':'len';
function dimBtn(sel,u,t){return `<button type="button" class="link dimb" data-a="dimOpen" data-for="${esc(sel)}" data-u="${esc(u||'')}" data-t="${esc(t||'')}">📐 По размерам</button>`}

  const st={mode:dimMode(u,t),rows:[{a:'',b:'',c:'',n:'1',minus:false}],sl:{W:'',H:'',D:'',Wo:'',Ho:'',sides:'3',n:'1'},k:1};

  const MODES=[['len','Длины'],['area','Площадь'],['vol','Объём'],['slope','Откосы']];
  const fm=x=>{const n=evalNum(x);return unitCm?n/100:n};
  const res=()=>{
    if(st.mode==='slope'){const r=slopeCalc({...st.sl,unit:unitCm?'cm':'m'});st.k=r.Dcm>30?1.3:1;return {q:r.lm,txt:r.text||'Укажи ширину, высоту и глубину',u:'п.м.',area:r.area,D:r.Dcm}}
    let q=0;const parts=[];st.rows.forEach(r=>{const a=fm(r.a),b=fm(r.b),c=fm(r.c),n=evalNum(r.n)||1;let x=0;
      if(st.mode==='len')x=a*n;else if(st.mode==='area')x=a*b*n;else x=a*b*c*n;if(!x)return;q+=r.minus?-x:x;
      parts.push((r.minus?'− ':'')+(st.mode==='len'?`${qf(r2(a))}`:st.mode==='area'?`${qf(r2(a))}×${qf(r2(b))}`:`${qf(r2(a))}×${qf(r2(b))}×${qf(r2(c))}`)+(n!==1?` ×${qf(n)}`:''))});
    return {q:r2(Math.max(0,q)),txt:parts.join(' + ').replace(/\+ −/g,'−'),u:st.mode==='len'?'п.м.':st.mode==='area'?'м²':'м³'}};
  const draw=()=>{const U=unitCm?'см':'м',I=(k,v,ph,i)=>`<input data-k="${k}" ${i!=null?`data-i="${i}"`:''} value="${esc(v)}" placeholder="${ph}" inputmode="decimal" autocomplete="off">`;

      <div class="dg3" style="margin-top:6px">${L('Верх снаружи',I('Wo',s2.Wo,'= ширине'))}${L('Высота снаружи',I('Ho',s2.Ho,'= высоте'))}${L('Проёмов',I('n',s2.n,'1'))}</div>

    else body=`<div class="drow dhead"><span>${st.mode==='len'?'длина, '+U:st.mode==='area'?'длина × ширина, '+U:'длина × ширина × высота, '+U}</span><span style="flex:0 0 56px;text-align:center">шт</span>${st.mode==='area'?'<span style="flex:0 0 38px"></span>':''}<span style="flex:0 0 38px"></span></div>`+st.rows.map((r,i)=>`<div class="drow">${I('a',r.a,st.mode==='len'?'длина':'длина',i)}${st.mode!=='len'?'<span>×</span>'+I('b',r.b,'ширина',i):''}${st.mode==='vol'?'<span>×</span>'+I('c',r.c,'высота',i):''}<span>×</span>${I('n',r.n,'шт',i)}

  const tail=()=>{const r=res(),T=box.querySelector('.dtail');if(!T)return;

      box.remove();toast('Подставлено: '+qf(r.q)+' '+r.u);return}
    draw();if(x==='add')keepFocus('a',st.rows.length-1)});
}

const amtOf=(c,r)=>c==='est'?r2((+r.qty||0)*(+r.price||0)):r2(+r.amount||0);
function logIt(act,c,r){
  if(!LOGC.includes(c)||isWorker()||!S.log)return;
  const t=Date.now(),amt=amtOf(c,r);
  let prevE=null;for(let i=S.log.length-1;i>=0;i--){if(S.log[i].rid===r.id){prevE=S.log[i];break}}
  const last=S.log[S.log.length-1];
  if(act==='edit'&&last&&last.rid===r.id&&last.by===me()&&t-last.t<120000){last.t=t;last.amt=amt;last.what=summary(c,r);mark('log',last.id);return}
  const e={id:'l'+uid(),t,by:me(),col:c,rid:r.id,act,what:summary(c,r),amt};
  if(act==='edit'&&prevE&&prevE.amt!==amt)e.prev=prevE.amt;
  if(act==='edit'&&prevE&&prevE.amt===amt&&c!=='objects'&&c!=='est')e.same=1;
  S.log.push(e);mark('log',e.id);
}
function put(c,r){
  const a=S[c]=S[c]||[];const i=a.findIndex(x=>x.id===r.id);
  if(i>=0&&a[i].by&&!r.by)r.by=a[i].by;
  if(!r.by&&me())r.by=me();
  r.ts=Date.now();
  i<0?a.push(r):a[i]=r;mark(c,r.id);
  logIt(i<0?'create':'edit',c,r);
  return r;
}
function del(c,id){
  const r=(S[c]||[]).find(x=>x.id===id);
  S[c]=(S[c]||[]).filter(x=>x.id!==id);mark(c,id);
  if(!r)return;
  if(TRASHC.includes(c)&&!isWorker()){const t={id:'tr_'+c+'_'+id,col:c,data:r,t:Date.now(),by:me()};const j=S.trash.findIndex(x=>x.id===t.id);j<0?S.trash.push(t):S.trash[j]=t;mark('trash',t.id)}
  logIt('delete',c,r);
}
function housekeep(){
  const now=Date.now();let ch=false;
  const old=S.trash.filter(x=>now-(x.t||0)>30*864e5);if(old.length){S.trash=S.trash.filter(x=>!old.includes(x));old.forEach(x=>mark('trash',x.id));ch=true}
  const ol=S.log.filter(x=>now-(x.t||0)>120*864e5);if(ol.length){S.log=S.log.filter(x=>!ol.includes(x));ol.forEach(x=>mark('log',x.id));ch=true}

}

  (t.tasks||[]).forEach(title=>put('tasks',{id:uid(),objectId:oid,title,done:false,who:'',due:''}));
  (t.est||[]).forEach(l=>{const r=l.rateId&&S.rates.find(x=>x.id===l.rateId);put('est',{id:uid(),objectId:oid,kind:l.kind||'work',rateId:l.rateId||null,title:r?r.name:l.title,unit:r?r.unit:l.unit,qty:l.qty||0,price:r?r.client:l.price})});

/* ---------- расчёты ---------- */
function payStatus(oid){
  const items=S.payplan.filter(p=>p.objectId===oid).sort((a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999')));
  let pool=objStats(oid).receivedWork;
  return {items:items.map(p=>{const paid=Math.max(0,Math.min(pool,+p.amount||0));pool-=paid;const left=r2((+p.amount||0)-paid);
    return {...p,paid,left,st:left<=0?'paid':(p.due&&p.due<today()?'late':paid>0?'part':'due')}}),total:sum(items,'amount')};
}
function estInfo(oid){
  const L=S.est.filter(e=>e.objectId===oid);
  const main=L.filter(e=>(e.kind||'work')!=='extra'),ex=L.filter(e=>e.kind==='extra');
  return {L,main,ex,base:estSum(main),work:estSum(main.filter(e=>(e.kind||'work')==='work')),mat:estSum(main.filter(e=>e.kind==='mat')),exOk:estSum(ex.filter(e=>e.ok)),exWait:estSum(ex.filter(e=>!e.ok)),total:estSum(main)+estSum(ex.filter(e=>e.ok))};
}
function matPlanFact(oid){
  const lines=S.est.filter(e=>e.objectId===oid&&e.kind==='mat');
  const ex=S.expenses.filter(e=>e.objectId===oid&&MAT_CATS.includes(e.category));
  const rows=lines.map(l=>{const f=sum(ex.filter(e=>e.estLine===l.id),'amount');return {l,plan:l.qty*l.price,fact:f}});
  return {rows,unlinked:sum(ex.filter(e=>!e.estLine||!lines.find(l=>l.id===e.estLine)),'amount'),plan:sum(rows,'plan'),fact:sum(ex,'amount')};
}
function cashState(){
  const st={};const add=(n,k,v)=>{n=n||'—';if(!st[n])st[n]={hand:0,taken:0,put:0};st[n][k]+=v};
  team().forEach(n=>add(n,'hand',0));
  S.payments.forEach(p=>add(holderOf(p),'hand',+p.amount||0));
  S.expenses.forEach(e=>add(holderOf(e),'hand',-(+e.amount||0)));
  S.work.filter(w=>w.type==='payout').forEach(w=>{const a=+w.amount||0;add(holderOf(w),'hand',-a);if(isPartner(w.worker))add(w.worker,'taken',a)});
  S.tools.forEach(t=>add(holderOf(t),'hand',-(+t.amount||0)));
  S.cash.forEach(c=>{const a=+c.amount||0;if(c.type==='move'){add(c.from,'hand',-a);add(c.to,'hand',a)}else if(c.type==='take'){add(c.src||c.from,'hand',-a);add(c.from,'taken',a)}else if(c.type==='put'){add(c.to,'hand',a);add(c.to,'put',a)}});
  const names=Object.keys(st);
  const shareOf=n=>{const t=S.team.find(x=>x.name===n);return t&&+t.share?+t.share:0};
  const hasShares=names.some(n=>shareOf(n)>0),inTeam=n=>!S.team.length||S.team.some(x=>x.name===n);
  const tn=names.filter(inTeam),tot=tn.reduce((s,n)=>s+st[n].hand+st[n].taken-st[n].put,0);
  const shTot=hasShares?tn.reduce((s,n)=>s+shareOf(n),0):tn.length;
  tn.forEach(n=>{const pos=st[n].hand+st[n].taken-st[n].put;st[n].diff=pos-tot*((hasShares?shareOf(n):1)/(shTot||1))});
  return {st,names,team:tn};
}
function monthStats(m){
  const inM=d=>String(d||'').startsWith(m);
  const pays=S.payments.filter(p=>inM(p.date)),work=S.work.filter(w=>inM(w.date)),ex=S.expenses.filter(e=>inM(e.date)),tools=S.tools.filter(t=>inM(t.date));
  const acc=work.filter(w=>w.type!=='payout'),hired=acc.filter(w=>!isPartner(w.worker));
  const r={recWork:sum(pays.filter(p=>p.kind!=='material'),'amount'),recMat:sum(pays.filter(p=>p.kind==='material'),'amount'),
    done:sum(acc,'client'),wages:sum(hired,'amount'),ownDone:sum(acc.filter(w=>isPartner(w.worker)),'client'),paidOut:sum(work.filter(w=>w.type==='payout'&&!isPartner(w.worker)),'amount'),
    mat:sum(ex.filter(e=>MAT_CATS.includes(e.category)),'amount'),fuel:sum(ex.filter(e=>e.category==='Топливо'),'amount'),
    other:sum(ex.filter(e=>!MAT_CATS.includes(e.category)&&e.category!=='Топливо'),'amount'),tools:sum(tools,'amount')};
  r.profit=r.recWork-r.wages-r.fuel-r.other;r.profitDone=Math.max(r.done,r.recWork)-r.wages-r.fuel-r.other;
  const ids=new Set([...pays,...work,...ex].map(x=>x.objectId).filter(Boolean));
  r.objs=[...ids].map(id=>{const P=pays.filter(p=>p.objectId===id),W=acc.filter(w=>w.objectId===id),E=ex.filter(e=>e.objectId===id);
    const rec=sum(P.filter(p=>p.kind!=='material'),'amount'),wg=sum(W.filter(w=>!isPartner(w.worker)),'amount'),mt=sum(E.filter(e=>MAT_CATS.includes(e.category)),'amount'),oth=sum(E.filter(e=>!MAT_CATS.includes(e.category)),'amount');
    return {id,name:oname(id),rec,done:sum(W,'client'),wages:wg,mat:mt,other:oth,profit:rec-wg-oth}}).sort((a,b)=>b.rec-a.rec);
  const created=S.objects.filter(o=>inM(o.created));
  r.leads=created.length;r.won=created.filter(o=>['active','done'].includes(objStatus(o))).length;r.lost=created.filter(o=>o.status==='lost').length;
  r.pays=pays;r.work=work;r.ex=ex;
  return r;
}

function alerts(){

      payStatus(o.id).items.forEach(it=>{if(it.left>0&&it.due&&it.due<=dAdd(T,2)){const d=daysSince(it.due);
        out.push({lvl:d>0?'bad':'warn',t:`${o.name}: ${it.title} ${money(it.left)} — ${d>0?'просрочено '+d+' дн.':d===0?'сегодня':'до '+fdate(it.due)}`,a:'openObj',id:o.id,tab:'money'})}});
      const st=objStats(o.id);
      if(st.clientOwes>=500){const lp=S.payments.filter(p=>p.objectId===o.id).map(p=>p.date).sort().pop(),fw=S.work.filter(w=>w.objectId===o.id&&w.type!=='payout').map(w=>w.date).sort()[0];
        const d=daysSince(lp&&lp>fw?lp:fw);if(d>=7)out.push({lvl:d>=14?'bad':'warn',t:`${o.name}: заказчик должен ${money(st.clientOwes)} (${d} дн.)`,a:'openObj',id:o.id,tab:'money'})}
      const ei=estInfo(o.id);if(ei.ex.some(e=>!e.ok))out.push({lvl:'warn',t:`${o.name}: доп. работы ждут согласования на ${money(ei.exWait)}`,a:'openObj',id:o.id,tab:'est'});
    }

  });
  const late=S.tasks.filter(taskLate);if(late.length)out.push({lvl:'bad',t:`Просрочено задач: ${late.length}`,a:'goTasks'});
  const owe=workerNames(true).filter(n=>!isPartner(n)).reduce((s,n)=>s+Math.max(0,workerStat(n).debt),0);if(owe>0)out.push({lvl:'info',t:`Рабочим к выплате ${money(owe)}`,a:'tab',id:'workers'});

  if(!session&&S.objects.length&&daysSince(S.settings.lastBackup||'2000-01-01')>7)out.push({lvl:'info',t:'Синхронизация выключена — сделай копию в файл',a:'backupNow'});

  return out.sort((a,b)=>({bad:0,warn:1,info:2}[a.lvl])-({bad:0,warn:1,info:2}[b.lvl]));
}

    SS.save=()=>{const name=v('on').trim();if(!name){toast('Введи название');return}
      const rec=put('objects',{...o,id:id||uid(),name,client:v('oc').trim(),phone:v('op').trim(),address:v('oa').trim(),status:SS.status,note:v('ono').trim(),created:o.created||today()});

async function readReceiptQR(file){const r=await qrFromFile(file,true);const q=r.best||r.other;return q?parseFiscal(q):null}
function parseFiscal(s){
  const get=k=>{const m=String(s).match(new RegExp('[?&]'+k+'=([^&#]+)','i'));return m?decodeURIComponent(m[1]):''};
  const sm=get('sm')||get('sum')||get('s');let d=get('date');
  if(/^\d{8}$/.test(d))d=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);else if(/^\d{2}\.\d{2}\.\d{4}$/.test(d))d=d.slice(6)+'-'+d.slice(3,5)+'-'+d.slice(0,2);else d='';
  return {raw:s,amount:sm?r2(num(sm)):0,date:d,fn:get('fn')};
}

/* ---------- выплата рабочему ----------

function unpaidWorks(name,exceptPay){
  const r=S.work.filter(x=>x.worker===name),acc=r.filter(x=>x.type!=='payout').sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.ts||0)-(b.ts||0));
  let paid=sum(r.filter(x=>x.type==='payout'&&x.id!==exceptPay),'amount');
  return acc.map(w=>{const a=+w.amount||0,c=Math.min(a,Math.max(0,paid));paid-=c;return {w,left:r2(a-c)}}).filter(x=>x.left>0.004);
}

/* ---------- голосовая / текстовая команда ---------- */
const stem=w=>{w=w.toLowerCase().replace(/ё/g,'е');return w.length<=4?w:w.slice(0,Math.max(4,Math.ceil(w.length*0.7)))};
const wmatch=(a,b)=>a.startsWith(stem(b))||b.startsWith(stem(a));
function findWorker(words){
  for(const n of workerNames()){const ns=n.toLowerCase().split(/\s+/);if(ns.some(x=>x.length>2&&words.some(w=>w.startsWith(x.slice(0,Math.min(4,x.length))))))return n}
  return '';
}
function findObj(words){
  let best=null,bs=0;
  activeObjs().forEach(o=>{const ws=(o.name+' '+(o.client||'')).toLowerCase().split(/[^\p{L}]+/u).filter(x=>x.length>3);
    const s=ws.filter(x=>words.some(w=>w.length>3&&wmatch(w,x))).length;if(s>bs){bs=s;best=o}});
  return best;
}
function findRate(words){
  let best=null,bs=0;
  rateMatches('').forEach(r=>{const ws=r.name.toLowerCase().split(/[^\p{L}]+/u).filter(x=>x.length>2);if(!ws.length)return;
    const m=ws.filter(x=>words.some(w=>w.length>2&&wmatch(w,x))).length;const s=m?m+m/ws.length:0;if(s>bs+1e-9){bs=s;best=r}});
  return best;
}
function runCmd(text){
  const t=String(text||'').trim();
  const cc=t&&parseCalcCmd(t);if(cc){openSheet(calcSheet(cc));return}
  if(!t){g('cmd')&&g('cmd').focus();toast('Нажми 🎤 на клавиатуре и скажи, например: «штроба 12 метров Иван»');return}
  const low=t.toLowerCase(),nm=low.match(/\d+(?:[.,]\d+)?/),n=nm?num(nm[0]):0;
  const words=low.replace(/\d+(?:[.,]\d+)?/g,' ').split(/[^\p{L}]+/u).filter(w=>w.length>1);
  const first=words[0]||'',has=(...k)=>words.some(w=>k.some(x=>w.startsWith(x)));
  const obj=findObj(words),oid=obj?obj.id:undefined;
  const strip=re=>t.replace(re,'').replace(/\s+/g,' ').trim();
  if(/^(задач|надо|нужно|напомн)/.test(first)){openSheet(taskSheet(null,{objectId:oid,title:strip(/^(задача|задачу|надо|нужно|напомни)\s*/i)}));return}
  if(/^(расход|купил|потратил|чек)/.test(first)){openSheet(expSheet(null,{objectId:oid,amount:n||'',title:strip(/^\S+\s*/).replace(nm?nm[0]:'#','').replace(/\b(грн|гривен|гривны|₴)\b/gi,'').trim()}));return}
  if(/^(оплат|заплатил|аванс|получил)/.test(first)){openSheet(paySheet(null,{objectId:oid,amount:n||''}));return}
  if(/^(выплат|выдал|дал)/.test(first)){const wk=findWorker(words);if(wk){openSheet(()=>payoutBody(wk,null,n||''));return}}
  if(/^(поездк|ехал|съездил)/.test(first)||(has('км','километр')&&!findRate(words))){openSheet(()=>tripBody({objectId:oid||lastObjFor(),trip:{km:n||'',roundtrip:true}}));return}
  const wk=findWorker(words),rate=findRate(words.filter(w=>!wk||!wk.toLowerCase().startsWith(w.slice(0,4))));
  openSheet(workSheet({objectId:oid,worker:wk||undefined,rateId:rate?rate.id:undefined,qty:n||undefined}));
  if(!rate)setTimeout(()=>toast('Работа не распознана — выбери из списка'),300);
}
