async function exportXlsx(m,r){
  toast('Готовлю Excel…');
  try{await loadScript('xlsx.full.min.js','XLSX')}catch(e){toast('Не удалось загрузить модуль Excel');return}
  const X=window.XLSX,wb=X.utils.book_new(),add=(name,rows)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),name);
  add('Сводка',[['Месяц',m],[],['Получено за работу',r.recWork],['Получено на материалы',r.recMat],['Выполнено работ (для заказчика)',r.done],['Зарплаты начислено',r.wages],['Зарплаты выплачено',r.paidOut],['Материалы',r.mat],['Топливо',r.fuel],['Прочие расходы',r.other],['Инструмент',r.tools],[],['Прибыль по оплатам',r.profit],['Прибыль по выполненному',r.profitDone],[],['Новых заявок',r.leads],['Стали объектами',r.won],['Отказ',r.lost]]);
  add('Объекты',[['Объект','Получено','Выполнено','Зарплаты','Материалы','Прочие расходы','Прибыль'],...r.objs.map(x=>[x.name,x.rec,x.done,x.wages,x.mat,x.other,x.profit])]);
  add('Работы',[['Дата','Объект','Рабочий','Работа','Кол-во','Ед.','Рабочему','Заказчику'],...r.work.slice().sort((a,b)=>String(a.date).localeCompare(b.date)).map(w=>w.type==='payout'?[w.date,oname(w.objectId),w.worker,'Выплата','','',-w.amount,'']:[w.date,oname(w.objectId),w.worker,workTitle(w),w.qty,w.unit||'',w.amount,w.client||''])]);
  add('Расходы',[['Дата','Объект','Категория','Что','Сумма','Кто платил'],...r.ex.slice().sort((a,b)=>String(a.date).localeCompare(b.date)).map(e=>[e.date,oname(e.objectId),e.category,e.title||'',e.amount,holderOf(e)])]);
  add('Оплаты',[['Дата','Объект','За что','Сумма','У кого','Заметка'],...r.pays.slice().sort((a,b)=>String(a.date).localeCompare(b.date)).map(p=>[p.date,oname(p.objectId),p.kind==='material'?'Материалы':'Работа',p.amount,holderOf(p),p.note||''])]);
  const out=X.write(wb,{bookType:'xlsx',type:'array'});
  await saveFile(`Отчёт_${m}.xlsx`,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

/* ---------- касса и партнёры ---------- */
function cashSheet(){return ()=>{
  const c=cashState(),T=c.team;
  const two=T.length===2?(()=>{const [a,b]=T,d=c.st[a].diff;if(Math.abs(d)<1)return 'Вы в расчёте 👍';return d>0?`<b>${esc(a)}</b> должен <b>${esc(b)}</b> ${money(d)}`:`<b>${esc(b)}</b> должен <b>${esc(a)}</b> ${money(-d)}`})():'';
  return {title:'Касса и партнёры',html:`<p class="muted sm">«На руках» — деньги, которые прошли через человека: получил от заказчиков, минус заплатил за материалы, рабочим и так далее. Отрицательное значение — человек вложил своё, и фирма ему должна.</p>
   ${two?`<div class="card" style="font-size:18px">${two}<br><small class="muted">с учётом того, кто сколько забрал себе и вложил${S.team.some(x=>+x.share)?', по долям':', поровну'}</small></div>`:''}
   <div class="list">${c.names.map(n=>{const s=c.st[n];return `<div class="li"><span class="t"><b>${esc(n)}</b><small>забрал себе ${money(s.taken)} · вложил ${money(s.put)}${s.diff!=null&&T.length>2?` · ${s.diff>0?'должен '+money(s.diff):'ему должны '+money(-s.diff)}`:''}</small></span><span class="r"><span class="n ${s.hand<0?'neg':''}">${money(s.hand)}</span><small>на руках</small></span></div>`}).join('')}</div>
   <div class="btns"><button class="btn" data-s="op" data-id="move">Передал</button><button class="btn" data-s="op" data-id="take">Забрал себе</button><button class="btn" data-s="op" data-id="put">Вложил</button></div>
   <button class="btn w" style="margin-top:8px" data-s="team">Партнёры и доли</button>
   <h2>Операции</h2><div class="list">${S.cash.slice().sort(byDate).slice(0,50).map(x=>LI(CASHT[x.type]+(x.note?' · '+esc(x.note):''),`${fdate(x.date)} · ${esc(x.type==='move'?x.from+' → '+x.to:x.type==='take'?x.from:x.to)}`,money(x.amount),'editCash',x.id)).join('')||'<p class="empty">Пока нет</p>'}</div>`,
  init(){SS.op=el=>openSheet(cashOpSheet(null,el.dataset.id));SS.team=()=>openSheet(teamSheet())}};
}}
function cashOpSheet(id,type){return ()=>{
  const x=S.cash.find(q=>q.id===id)||{type,from:me(),to:team().find(n=>n!==me())||me(),amount:'',date:today()};
  const t=team(),sel=(fid,cur)=>`<div class="chips" id="${fid}C">${t.map(n=>chip(esc(n),n===cur,fid,n,'data-s="1"')).join('')}</div>`;
  return {title:CASHT[x.type],html:`${F('Сумма, ₴',N('ca',x.amount,'style="font-size:24px;font-weight:700"'))}
   ${x.type!=='put'?F(x.type==='move'?'Кто передал':'Кто забрал',sel('cfrom',x.from)):''}
   ${x.type!=='take'?F(x.type==='move'?'Кому':'Кто вложил',sel('cto',x.to)):''}
   <div class="two">${F('Дата',`<input id="cd" type="date" value="${x.date}">`)}${F('Заметка',I('cn',x.note))}</div>
   <div class="btns">${delBtn(!!id)}<button class="btn p" data-s="save">Сохранить</button></div>`,
  init(){SS.from=x.from;SS.to=x.to;SS.cfrom=el=>{SS.from=el.dataset.id;setChip('cfromC',SS.from)};SS.cto=el=>{SS.to=el.dataset.id;setChip('ctoC',SS.to)};
    if(!id)setTimeout(()=>{const _e=g('ca');_e&&_e.focus()},80);
    SS.save=()=>{const a=num(v('ca'));if(a<=0){toast('Сумма');return}put('cash',{...x,id:id||uid(),amount:r2(a),from:SS.from,to:SS.to,date:v('cd')||today(),note:v('cn').trim()});commit();back()};
    SS.del=()=>{del('cash',id);commit();back()}}};
}}
function teamSheet(){let ed=null;return ()=>{
  const sh=S.team.reduce((t,x)=>t+(+x.share||0),0),dup=S.team.length-new Set(S.team.map(x=>String(x.name).trim().toLowerCase())).size;
  const row=t=>ed===t.id?`<div class="li" style="flex-wrap:wrap;gap:8px"><input id="te_n" value="${esc(t.name)}" style="flex:2;min-width:120px"><input id="te_s" inputmode="decimal" value="${t.share||''}" placeholder="доля %" style="flex:1;min-width:80px">
      <div class="btns" style="width:100%;margin:0"><button class="btn bad" data-s="rm" data-id="${t.id}">Удалить</button><button class="btn" data-s="cancel">Отмена</button><button class="btn p" data-s="ok" data-id="${t.id}">Сохранить</button></div></div>`
    :`<button class="li" data-s="edit" data-id="${t.id}"><span class="av">${esc(initials(t.name))}</span><span class="t"><b>${esc(t.name)}${t.name===me()?' <small class="muted">· это вы</small>':''}</b><small>${+t.share?'доля '+qf(t.share)+'%':'поровну'}</small></span><span class="muted">✎</span></button>`;
  return {title:'Партнёры и доли',html:`<p class="muted sm">Нажми на партнёра, чтобы изменить имя или долю. Имена должны совпадать с «Моё имя» на телефонах партнёров. Доли пустые — прибыль делится поровну.</p>
  ${dup?`<div class="alert warn"><i></i><span>Есть повторы имён (${dup}). <button class="link" data-s="dedup">Убрать повторы</button></span></div>`:''}
  ${(()=>{const no=S.team.filter(x=>!+x.share);return sh&&no.length?`<div class="alert warn"><i></i><span>Доля не указана у: ${no.map(x=>esc(x.name)).join(', ')}. Укажи доли всем (в сумме 100%) или оставь всем пустыми — тогда поровну.</span></div>`:sh&&Math.abs(sh-100)>0.01?`<div class="alert warn"><i></i><span>Сумма долей ${qf(sh)}%, а должна быть 100%</span></div>`:''})()}
  <div class="list">${S.team.map(row).join('')||'<p class="empty">Добавь себя и партнёра</p>'}</div>
  <h2>Добавить партнёра</h2>
  <div class="two">${F('Имя',I('tmn',S.team.some(x=>x.name===me())?'':me()))}${F('Доля, % (необяз.)',N('tms',''))}</div><button class="btn p w" style="margin-top:8px" data-s="add">Добавить</button>
  ${S.team.length?`<button class="btn w bad" style="margin-top:18px" data-s="clear">Очистить список партнёров</button>`:''}`,
  init(){
    const re=()=>replaceSheet(sheets[sheets.length-1]);
    SS.add=()=>{const n=v('tmn').trim();if(!n)return toast('Впиши имя');if(S.team.some(x=>x.name.trim().toLowerCase()===n.toLowerCase()))return toast('Такой партнёр уже есть');put('team',{id:uid(),name:n,share:num(v('tms'))||0});commit(true);re()};
    SS.edit=el=>{ed=el.dataset.id;re();setTimeout(()=>{const e=g('te_n');e&&e.focus()},60)};
    SS.cancel=()=>{ed=null;re()};
    SS.ok=el=>{const t=S.team.find(x=>x.id===el.dataset.id);if(!t)return;const n=v('te_n').trim();if(!n)return toast('Имя пустое');const old=t.name;
      t.name=n;t.share=num(v('te_s'))||0;put('team',t);
      if(old!==n&&confirm(`Переименовать «${old}» → «${n}» и в старых записях (кто платил, у кого деньги, касса)?`)){
        ['payments','expenses','work','tools','cash'].forEach(c=>(S[c]||[]).forEach(r=>{let ch=false;['holder','by','from','to'].forEach(k=>{if(r[k]===old){r[k]=n;ch=true}});if(ch)put(c,r)}))}
      ed=null;commit(true);re();toast('Сохранено')};
    SS.rm=el=>{const t=S.team.find(x=>x.id===el.dataset.id);if(!t||!confirm(`Убрать «${t.name}» из партнёров? Записи останутся.`))return;del('team',t.id);ed=null;commit(true);re()};
    SS.dedup=()=>{const seen=new Set();S.team.slice().forEach(t=>{const k=String(t.name).trim().toLowerCase();if(seen.has(k))del('team',t.id);else seen.add(k)});commit(true);re();toast('Повторы убраны')};
    SS.clear=()=>{if(!confirm('Удалить всех партнёров из списка? Записи об оплатах и расходах останутся.'))return;S.team.slice().forEach(t=>del('team',t.id));commit(true);re()};
  }}}}

/* ---------- шаблоны ---------- */
function saveAsTpl(oid){
  const o=S.objects.find(x=>x.id===oid);const name=prompt('Название шаблона',o?o.name:'');if(!name)return;

let bdbP=null;
function bdb(){if(bdbP)return bdbP;bdbP=new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error('no idb'));return}const r=indexedDB.open('stroyka-bak',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return bdbP}
async function bTx(mode,fn){const db=await bdb();return new Promise((res,rej)=>{const t=db.transaction('b',mode),rq=fn(t.objectStore('b'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})}
async function autoBackup(force){
  if(isWorker())return;
  const T=today();if(!force&&S.settings.lastAutoBak===T)return;
  try{
    const data=JSON.stringify({...S,trash:[],log:[]});
    await bTx('readwrite',s=>s.put(data,T));
    const keys=(await bTx('readonly',s=>s.getAllKeys()))||[];keys.sort();
    for(const k of keys.slice(0,Math.max(0,keys.length-10)))await bTx('readwrite',s=>s.delete(k));
    S.settings.lastAutoBak=T;saveLocal();
  }catch(e){console.error(e)}
}

function periodRange(k){const d=new Date(),f=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());

  if(k==='pweek'){const a=new Date(weekStart());a.setDate(a.getDate()-7);const b=new Date(a);b.setDate(b.getDate()+6);return [f(a),f(b)]}

  if(k==='pmonth'){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);return [f(a),f(b)]}

function replyHtml(m){return m.reply?`<div class="mrep"><b>${esc(m.reply.by||'')}</b>${esc(m.reply.t||'')}</div>`:''}

const tileOf=(lat,lng,z)=>{const n=2**z,x=(lng+180)/360*n,r=lat*Math.PI/180,y=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n;return {x,y}};
function msgExtra(m){
  const mine=m.by===chMe(),tm=chatTime(m)+(m.edited?' · изм.':''),head=mine?'':`<b class="mby">${esc(m.by||'')}</b>`,wrap=inner=>`<div class="msg ${mine?'me':''} ${m.kind}" data-a="msgMenu" data-id="${m.id}">${head}${inner}${reactHtml(m)}<small class="mt">${tm}</small></div>`;
  if(m.kind==='img')return wrap(`<div class="mimg"><img data-ph="${m.img}" data-a="msgImg" data-id="${m.img}" alt="" style="aspect-ratio:${m.w||4}/${m.h||3}">${m.text?`<div class="mcap">${linkify(esc(m.text))}</div>`:''}</div>`);
  if(m.kind==='geo'){const z=16,t=tileOf(m.lat,m.lng,z),tx=Math.floor(t.x),ty=Math.floor(t.y),px=(t.x-tx)*100,py=(t.y-ty)*100;
    return wrap(`<div class="mgeo"><div class="map"><img src="https://tile.openstreetmap.org/${z}/${tx}/${ty}.png" alt="" onerror="this.style.display='none'"><i style="left:${px}%;top:${py}%"></i></div>
      <div class="gi"><b>${esc(m.label||'Геопозиция')}</b><small>${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}${m.acc?' · ±'+Math.round(m.acc)+' м':''}</small>
      <div class="chips" style="margin-top:6px;flex-wrap:wrap"><button class="chip" data-a="openMap" data-id="${m.id}" data-u="g">Google Карты</button>${isIOS()?`<button class="chip" data-a="openMap" data-id="${m.id}" data-u="a">Apple Карты</button>`:''}<button class="chip" data-a="openMap" data-id="${m.id}" data-u="w">Waze</button><button class="chip" data-a="copyGeo" data-id="${m.id}">⧉ Координаты</button></div></div></div>`)}
  if(m.kind==='poll'){const tot=(m.opts||[]).reduce((s,o)=>s+(o.v||[]).length,0);

  return null;
}

async function getGeo(){
  const G=capP('Geolocation');
  if(G){try{await G.requestPermissions().catch(()=>{});const p=await G.getCurrentPosition({enableHighAccuracy:true,timeout:15000});return {lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}}catch(e){}}
  return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('нет геолокации'));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>rej(e),{enableHighAccuracy:true,timeout:15000,maximumAge:30000})});
}

/* ---------- редактор фото / набросок ---------- */
function photoEditor({src,sketch,onSend,onClose,cap:cap0}){
  const ov=document.createElement('div');ov.className='ped';
  const COLS=['#ff3b30','#ffcc00','#34c759','#0a84ff','#ffffff','#111111'];
  ov.innerHTML=`<div class="pbar"><button class="pb" data-x="close">✕</button><b>${sketch?'Набросок':'Фото'}</b><button class="pb" data-x="undo">↶</button>${sketch?'':'<button class="pb" data-x="rot">⟳</button>'}</div>
   <div class="pcv"><canvas></canvas></div>
   <div class="ptools">${[['pen','✏️'],['line','╱'],['arrow','↗'],['rect','▭'],['circle','◯'],['dim','📏'],['text','T']].map(([k,i])=>`<button data-t="${k}" class="${k==='pen'?'on':''}">${i}</button>`).join('')}</div>
   <div class="pcols">${COLS.map((c,i)=>`<button data-c="${c}" class="${i===(sketch?5:0)?'on':''}" style="background:${c}"></button>`).join('')}<button data-w="1" class="pw">${'●'}</button></div>
   <div class="psend"><input placeholder="Подпись…" id="pedCap" value="${esc(cap0||'')}"><button class="ico send" data-x="send"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div>`;
  document.body.appendChild(ov);history.pushState({ped:1},'');
  const cv=ov.querySelector('canvas'),x=cv.getContext('2d'),box=ov.querySelector('.pcv');
  let base=document.createElement('canvas'),ops=[],tool='pen',col=sketch?'#111111':'#ff3b30',wd=1,cur=null,closed=false;
  const lw=()=>Math.max(base.width,base.height)/(wd===1?220:wd===2?120:400);
  const fitView=()=>{const bw=box.clientWidth,bh=box.clientHeight,k=Math.min(bw/base.width,bh/base.height),dpr=Math.min(2,devicePixelRatio||1);
    cv.style.width=Math.round(base.width*k)+'px';cv.style.height=Math.round(base.height*k)+'px';cv.width=Math.round(base.width*k*dpr);cv.height=Math.round(base.height*k*dpr);paint()};
  const drawOp=(c,o,s)=>{c.save();c.strokeStyle=c.fillStyle=o.c;c.lineWidth=o.w*s;c.lineCap='round';c.lineJoin='round';const P=q=>[q[0]*s,q[1]*s];
    if(o.t==='pen'){c.beginPath();o.p.forEach((q,i)=>{const [a,b]=P(q);i?c.lineTo(a,b):c.moveTo(a,b)});c.stroke()}
    else if(o.t==='line'||o.t==='arrow'||o.t==='dim'){const [a,b]=P(o.a),[e,f]=P(o.b);c.beginPath();c.moveTo(a,b);c.lineTo(e,f);c.stroke();
      const ang=Math.atan2(f-b,e-a),h=o.w*s*4.5;
      if(o.t==='arrow'){c.beginPath();c.moveTo(e,f);c.lineTo(e-h*Math.cos(ang-.45),f-h*Math.sin(ang-.45));c.moveTo(e,f);c.lineTo(e-h*Math.cos(ang+.45),f-h*Math.sin(ang+.45));c.stroke()}
      if(o.t==='dim'){[[a,b],[e,f]].forEach(([u,w])=>{c.beginPath();c.moveTo(u-h*.7*Math.cos(ang+Math.PI/4),w-h*.7*Math.sin(ang+Math.PI/4));c.lineTo(u+h*.7*Math.cos(ang+Math.PI/4),w+h*.7*Math.sin(ang+Math.PI/4));c.stroke()});
        if(o.s){const fs=o.w*s*7;c.font=`700 ${fs}px Manrope,Arial,sans-serif`;c.textAlign='center';c.textBaseline='bottom';c.translate((a+e)/2,(b+f)/2);let r=ang;if(r>Math.PI/2)r-=Math.PI;if(r<-Math.PI/2)r+=Math.PI;c.rotate(r);
          const tw=c.measureText(o.s).width;c.fillStyle=sketch?'#fff':'rgba(0,0,0,.55)';c.fillRect(-tw/2-fs*.2,-fs*1.25,tw+fs*.4,fs*1.15);c.fillStyle=sketch?o.c:'#fff';c.fillText(o.s,0,-fs*.2)}}}
    else if(o.t==='rect'){const [a,b]=P(o.a),[e,f]=P(o.b);c.strokeRect(Math.min(a,e),Math.min(b,f),Math.abs(e-a),Math.abs(f-b))}
    else if(o.t==='circle'){const [a,b]=P(o.a),[e,f]=P(o.b);c.beginPath();c.ellipse((a+e)/2,(b+f)/2,Math.abs(e-a)/2,Math.abs(f-b)/2,0,0,7);c.stroke()}

function edgeOps(p,r,i){

   <button class="btn p w" style="margin-top:12px" data-s="npGo">Создать</button>`,
  init(){SS.oid=oid||'';SS.tpl='room';
    SS.npObj=el=>{SS.oid=el.dataset.id;setChip('np_obj',SS.oid)};SS.npTpl=el=>{SS.tpl=el.dataset.id;setChip('np_tpl',SS.tpl)};
    SS.npGo=()=>{const name=v('np_name').trim(),o={name,empty:SS.tpl==='empty'},id=SS.oid;closeAllSheets();setTimeout(()=>newPlan(id,o),200)}}};
}}
function attachPlanSheet(oid){return ()=>{
  const list=S.plans.filter(p=>p.objectId!==oid);
  return {title:'Привязать чертёж',html:`<div class="list">${list.length?list.map(pl=>{const o=S.objects.find(x=>x.id===pl.objectId);return `<button class="li" data-s="atP" data-id="${pl.id}"><span class="t"><b>📐 ${esc(pl.name)}</b><small>${o?'сейчас: '+esc(o.name):'без объекта'}</small></span><span class="n">${fA(planCalc(pl).floor)} м²</span></button>`}).join(''):'<p class="empty">Других чертежей нет</p>'}</div>`,
  init(){SS.atP=el=>{const p=S.plans.find(x=>x.id===el.dataset.id);if(!p)return;p.objectId=oid;put('plans',p);commit(true);toast('Чертёж привязан');back()}}};
}}
function planInit(){
  Object.assign(A,{
    planF(el){ui.planF=el.dataset.id;render()},
    newPlanS(el){openSheet(newPlanSheet(el&&el.dataset.id||''))},
    attachPlan(el){openSheet(attachPlanSheet(el.dataset.id))},
  });
}

/* ================= действия ================= */
const A={
  tab(el){ui.tab=el.dataset.id;const n=ui.page.length;ui.page=[];if(n)history.go(-n);render();window.scrollTo(0,0)},
  goBack(){back()},close(){back()},
  more(){openSheet(moreSheet())},syncSheet(){openSheet(syncSheet())},
  fab(el){if(el.dataset.k==='task'){openSheet(taskSheet(null,{}))}else{const p=curPage();openSheet(workSheet(p&&p.t==='obj'?{objectId:p.id}:p&&p.t==='worker'?{worker:p.id}:{}))}},
  objF(el){ui.objF=el.dataset.id;render()},taskF(el){ui.taskF=el.dataset.id;render()},
  newObj(){openSheet(objSheet(null))},editObj(el){openSheet(objSheet(el.dataset.id))},
  openObj(el){ui.showDone=false;ui.showAllWork=false;openPage({t:'obj',id:el.dataset.id})},
  openWorker(el){openPage({t:'worker',id:el.dataset.id})},
  newWork(el){openSheet(workSheet({objectId:el.dataset.id}))},editWork(el){openSheet(workSheet({id:el.dataset.id}))},
  newExp(el){openSheet(expSheet(null,{objectId:el.dataset.id}))},editExp(el){openSheet(expSheet(el.dataset.id))},
  newPay(el){openSheet(paySheet(null,{objectId:el.dataset.id}))},editPay(el){openSheet(paySheet(el.dataset.id))},
  newTrip(el){openSheet(()=>tripBody({objectId:el.dataset.id||lastObjFor(),trip:{km:'',roundtrip:true}}))},
  estSheet(el){openSheet(estSheet(el.dataset.id))},newPlan(el){newPlan(el.dataset.id)},openPlan(el){openPage({t:'plan',id:el.dataset.id})},actPdf(el){actPdf(el.dataset.id)},
  allWork(){ui.showAllWork=true;render()},toggleDone(){ui.showDone=!ui.showDone;render()},
  tick(el){const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t)return;t.done=!t.done;t.doneBy=t.done?me():'';put('tasks',t);commit();if(t.done)toast('Готово ✓')},
  editTask(el){openSheet(taskSheet(el.dataset.id))},
  qTask(el){const i=g('qTask');const t=i.value.trim();if(!t){i.focus();return}put('tasks',{id:uid(),objectId:el.dataset.id,title:t,done:false,who:'',due:''});commit();setTimeout(()=>{const n=g('qTask');n&&n.focus()},30)},
  newWorker(){openSheet(workerSheet(''))},editWorker(el){openSheet(workerSheet(el.dataset.id))},
  payout(el){openSheet(()=>payoutBody(el.dataset.id,null))},workerReport(el){workerReport(el.dataset.id)},
  startDay(){openSheet(daySheet(null,'start'))},endDay(el){openSheet(daySheet(el.dataset.id,'end'))},editDay(el){openSheet(daySheet(el.dataset.id,'edit'))},
  fuelSet(){openSheet(fuelSetSheet())},
  pickObj(el){SS.obj=el.dataset.id;setChip('pickObjC',SS.obj);SS.after&&SS.after()},
};
/* обработчики внутри форм, общие для чипов */
const CHIP_STATE={pickWk:'wk',cat:'cat',k:'kind',who:'who',rt:'rt',mk:'mk'};
document.addEventListener('click',ev=>{
  const ln=ev.target.closest('a[href]');if(ln){if(ln.dataset.ext)return;if(ln.target==='_blank'&&/^https?:/.test(ln.href)){ev.preventDefault();ev.stopPropagation();openExt(ln.href)}return}
  const ee=ev.target.closest('[data-e]');if(ee&&ED){ev.preventDefault();ED.act(ee.dataset.e,ee);return}
  const el=ev.target.closest('[data-a],[data-s]');if(!el)return;
  if(el.tagName==='A')return;
  const a=el.dataset.a,s=el.dataset.s;
  if(s&&s!=='1'){
    const h={
      dec:()=>{const q=Math.max(0,num(v('wq'))-1);g('wq').value=q||'';calc()},
      inc:()=>{g('wq').value=r2(num(v('wq'))+1);calc()},
      chRate:()=>{SS.rate=null;drawRate();setTimeout(()=>g('rq')&&g('rq').focus(),50)},
      pickRate:()=>{const r=S.rates.find(x=>x.id===el.dataset.id);SS.rate={...r};drawRate()},
      customRate:()=>{const q=(v('rq')||'').trim();const name=q||prompt('Название работы');if(!name)return;SS.rate={id:null,name:name[0].toUpperCase()+name.slice(1),unit:'шт',worker:0,client:0,custom:true};drawRate();setTimeout(()=>{const _e=g('wp');_e&&_e.focus()},60)},
      newWk:()=>{g('newWkBox').hidden=false;g('nwk').focus()},
      addWk:()=>{const n=v('nwk').trim();if(!n)return;if(!S.workers.find(w=>w.name===n))put('workers',{id:wid(n),name:n,phone:''});saveLocal();saveSync();schedule(800);
        const c=g('pickWkC');c.insertAdjacentHTML('afterbegin',chip(esc(n),false,'pickWk',n,'data-s="1"'));SS.wk=n;setChip('pickWkC',n);g('newWkBox').hidden=true;g('nwk').value=''},
      save:()=>SS.save?SS.save():saveWork(false),saveMore:()=>saveWork(true),
    };
    if(SS.save&&s==='save'){ev.preventDefault();SS.save();return}
    if(SS[s]){ev.preventDefault();SS[s](el);return}
    if(h[s]){ev.preventDefault();h[s]();return}
  }
  if(a){
    if(s==='1'&&CHIP_STATE[a]){SS[CHIP_STATE[a]]=a==='rt'?el.dataset.id==='1':el.dataset.id;setChip(el.parentElement.id,el.dataset.id);if(a==='rt'&&SS.calc)SS.calc();SS.after&&SS.after();return}
    if(s==='1'&&SS[a]){SS[a](el);return}
    if(A[a]){ev.preventDefault();A[a](el,ev)}
  }
});
document.addEventListener('input',ev=>{
  if(ED&&!sheets.length&&ev.target.closest&&ev.target.closest('#edp')){ED.input(ev);return}
  if(!sheets.length)return;
  if(ev.target.id==='rq'){drawRateList(ev.target.value);return}
  if(['wq','wp','cp'].includes(ev.target.id)){calc();return}
  if(ev.target.id==='m3a'||ev.target.id==='m3t'){const q=r2(num(v('m3a'))*num(v('m3t'))/100);g('wq').value=q||'';calc();return}
  SS.input&&SS.input(ev);
});
document.addEventListener('change',ev=>{if(!sheets.length&&(ev.target.id==='objPhIn'||ev.target.id==='objPhIn2')){addObjPhotos(ev.target);return}if(sheets.length&&SS.change)SS.change(ev)});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;const t=ev.target;
  if(t.dataset&&t.dataset.enter){ev.preventDefault();A[t.dataset.enter](t);return}
  if(t.id==='wq'){ev.preventDefault();saveWork(false);return}
  if(t.id==='nwk'){ev.preventDefault();document.querySelector('[data-s=addWk]').click()}
  if(t.id==='ckn'&&SS.ckA){ev.preventDefault();SS.ckA()}
});
document.addEventListener('focusin',ev=>{if(ED&&ev.target.closest&&ev.target.closest('#edp'))ED.undoPending=true});
document.addEventListener('focusout',ev=>{if(ED&&ED.needSync)setTimeout(()=>ED&&ED.sync(),250)});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!typing()&&!sheets.length)render()},200));

/* ================= старт ================= */
bizInit();seedRates();linkSeeds();seedTpls();migrate();housekeep();applyBig();
SY.pend=SY.pend||{};SY.ph=SY.ph||{};
render();
if(initSb()){sb.auth.getSession().then(({data})=>{session=data.session;if(session){subscribe();schedule(50);fetchRole()}setStatus()})}
setTimeout(()=>autoBackup(),4000);
nativeInit();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
